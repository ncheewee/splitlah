<style>
:root{--bg:#191a17;--panel:#2b2c28;--panel2:#242520;--line:#4c4d46;--head:#075943;--head2:#0f6e56;--accent:#1d9e75;--mint:#dff8ef;--text:#f5f2eb;--muted:#b8b7af;--bad:#e24b4a;--warn:#f3aa28;--blue:#3b8fde;--r:18px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#050605;color:var(--text)}
*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);border-left:1px solid #383a34;border-right:1px solid #383a34}.view{display:none}.view.on{display:block}.head{background:var(--head);padding:22px 20px 0}.brand{letter-spacing:.14em;color:#69d4ad;font-weight:900;font-size:.76rem}.h1{font-size:1.9rem;line-height:1.05;font-weight:900;margin:12px 0 6px}.sub{color:#a9d2c4;font-weight:750}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.share{background:rgba(255,255,255,.12);border-radius:16px;padding:12px 15px;min-width:98px;text-align:center}.share b{display:block;font-size:1.38rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.stat{background:rgba(255,255,255,.1);border-radius:13px;padding:10px}.k{color:#bebdb7;text-transform:uppercase;letter-spacing:.1em;font-size:.67rem;font-weight:900}.v{font-weight:950;font-size:1.12rem;margin-top:5px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px}.tab{border:0;background:transparent;color:#8db5a7;padding:15px 4px 13px;font-weight:850;font-size:.84rem}.tab.on{color:#fff;border-bottom:3px solid #69d4ad}.body{padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;background:var(--accent);color:white;padding:13px 14px;font-weight:900;font-size:1rem}.btn.sec{background:#2c6f5d}.btn.ghost{background:#272823;border:1px solid var(--line);color:var(--text)}.btn.bad{background:var(--bad)}.mini{padding:8px 10px;font-size:.78rem;border-radius:10px}.field{width:100%;border:1px solid #55564f;border-radius:13px;background:#242520;color:#fff;padding:13px;font:inherit;outline:none}.field:focus{border-color:#65d4ad}select.field{appearance:none;-webkit-appearance:none;padding-right:36px}.selectWrap{position:relative;display:block}.selectWrap:after{content:'▾';position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#69d4ad;font-weight:900;pointer-events:none}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.seg input,.checkrow input{position:absolute;opacity:0;pointer-events:none}.seg span,.checkrow span{display:block;border:1px solid #55564f;background:#242520;color:var(--text);border-radius:13px;padding:11px;text-align:center;font-weight:850}.seg input:checked+span,.checkrow input:checked+span{border-color:#69d4ad;background:#123f33;color:#dff8ef}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.splitCustom{margin-top:10px}.shareGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.muted{color:var(--muted)}.good{color:var(--accent)}.badTxt{color:var(--bad)}.code{background:var(--mint);color:var(--head);border-radius:999px;padding:6px 10px;font-weight:900;font-size:.75rem}.owner{background:#173b32;color:#8ce8c4;border-radius:999px;padding:5px 8px;font-weight:900;font-size:.68rem}.avatars{display:flex}.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.74rem;margin-right:-8px;border:2px solid var(--panel);color:#073f34}.amount{font-weight:950;font-size:1.22rem}.trip{min-height:112px;cursor:pointer}.pill{border-radius:999px;padding:5px 9px;background:#203d35;color:#8ce8c4;font-weight:850;font-size:.75rem}.expense{padding:13px 0;border-bottom:1px solid #464740}.expense:last-child{border-bottom:0}.bar{height:8px;background:#22231f;border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px;background:var(--accent)}.pay{background:#242520;border-radius:13px;padding:11px;margin-top:8px;cursor:pointer}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:50;max-width:90%;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:flex-end;justify-content:center;z-index:40}.modal.on{display:flex}.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 14px}.close{float:right}.donut{width:138px;height:138px;border-radius:50%;position:relative;margin:10px auto;background:conic-gradient(var(--accent) 0 20%,var(--blue) 20% 42%,var(--warn) 42% 82%,#e95832 82% 100%)}.donut:after{content:attr(data-label);white-space:pre;position:absolute;inset:38px;background:var(--panel);border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:900}.chart{height:124px;display:flex;align-items:end;gap:14px;border-top:1px solid #44453f;border-bottom:1px solid #44453f;padding:12px 8px}.col{flex:1;background:var(--accent);border-radius:8px 8px 0 0;min-height:2px}.qr{width:126px;height:126px;background:#e9fff8;margin:20px auto;border-radius:12px;display:grid;place-items:center;color:var(--head);font-size:4.1rem}.check{width:88px;height:88px;border-radius:50%;background:var(--mint);color:var(--head);display:grid;place-items:center;font-size:3rem;margin:28px auto}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}.fxbox{background:#20221e;border-radius:14px;padding:12px;margin-top:10px}.homeHead{background:var(--head);padding:22px 20px 26px}.screenTitle{font-size:1.45rem;font-weight:900}.hidden{display:none!important}@media(max-width:390px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.tabs{font-size:.78rem}}
.donut:after{white-space:normal;font-size:.82rem;line-height:1.15}body{font-size:14px}.h1{font-size:1.55rem}.screenTitle{font-size:1.2rem}.amount{font-size:1.05rem}.share b{font-size:1.12rem}.v{font-size:1rem}.btn{font-size:.92rem;padding:11px 12px}.field{padding:11px}.selectWrap .field{padding-right:36px}.homeHead{padding:20px 20px 24px}.head{padding-top:20px}.card{padding:14px}.tab{font-size:.78rem}
</style>
</head>
<body>
<main class="app">
  <section id="home" class="view on">
    <div class="homeHead">
      <div class="brand">SPLITLAH - Codex build</div>
      <div class="row"><div class="h1 grow" id="hello">Hi there</div><button class="btn ghost mini" onclick="openSettings()">Edit profile</button></div>
      <div class="sub">Your trips</div>
      <div class="grid2" style="margin-top:22px"><button class="btn" onclick="openNewTrip()">+ New trip</button><button class="btn sec" onclick="openJoin()">Join code</button></div>
    </div>
    <div class="body" id="tripList"></div>
  </section>
  <section id="trip" class="view">
    <header class="head">
      <div class="brand">SPLITLAH - Codex build</div>
      <div class="top"><div><div class="h1" id="tripName">Trip</div><div class="sub" id="tripMeta">CODE · members</div></div><div class="share"><div class="k">Your share</div><b id="yourShare">S$0</b></div></div>
      <div class="stats"><div class="stat"><div class="k">Total</div><div class="v" id="statTotal">S$0</div></div><div class="stat"><div class="k">Per pax</div><div class="v" id="statPax">S$0</div></div><div class="stat"><div class="k">Exps</div><div class="v" id="statExp">0</div></div><div class="stat"><div class="k">Days</div><div class="v" id="statDays">1</div></div></div>
      <nav class="tabs"><button class="tab" id="tab-dashboard" onclick="setTab('dashboard')">Dashboard</button><button class="tab" id="tab-expenses" onclick="setTab('expenses')">Expenses</button><button class="tab" id="tab-balances" onclick="setTab('balances')">Balances</button><button class="tab" id="tab-members" onclick="setTab('members')">Members</button></nav>
    </header>
    <div class="body">
      <div class="grid2" style="margin-bottom:12px"><button class="btn ghost" onclick="goHome()">Back to trips</button><button class="btn ghost" onclick="shareTrip()">Share trip</button></div>
      <div id="tabBody"></div>
    </div>
  </section>
  <section id="settle" class="view">
    <div class="head" style="padding-bottom:26px"><button class="btn ghost" onclick="openTrip(cur.code,'balances')">Back</button><div class="h1">Settle up</div><div class="row" style="margin-top:16px"><div class="av" id="payFromAv"></div><div class="grow"><div class="sub" id="payFromName">Payer owes</div><div class="h1" id="payAmt">S$0</div><div class="sub" id="payToName" style="text-align:right">to payee</div></div><div class="av" id="payToAv"></div></div></div>
    <div class="body"><div class="card" id="payCard"></div><button class="btn" style="width:100%" onclick="markPaid()">Mark as paid</button></div>
  </section>
  <section id="paid" class="view">
    <div class="head" style="padding-bottom:18px"><button class="btn ghost" onclick="openTrip(cur.code,'balances')">Back</button><div class="h1">Settle up</div></div>
    <div class="body" style="text-align:center"><div class="check">✓</div><div class="screenTitle">Payment recorded</div><div class="muted" id="paidText" style="margin:8px 0 24px"></div><div id="paidProgress"></div><button class="btn ghost" style="width:100%" onclick="openTrip(cur.code,'dashboard')">Back to trip</button></div>
  </section>
</main>
<div class="modal" id="modal"><div class="sheet"><button class="btn ghost close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API_DEFAULT='https://splitlah-api.ncheewee.workers.dev',LS='sl_codex_v1',APP_VERSION=14;
const colors=['#dff8ef','#e2f2ff','#fff2d7','#ffe9e4','#eadfff','#dff7ff','#f1ffd9'];
let state=JSON.parse(localStorage.getItem(LS)||'{}'),cur=null,tab='dashboard',settleTarget=null,pendingJoin=null,joinParam=new URLSearchParams(location.search).get('join');
if(!state.uid)state.uid='u_'+crypto.randomUUID(); if(state.name==null)state.name=''; if(state.onboarded==null)state.onboarded=!!state.name; if(!state.api)state.api=API_DEFAULT; if(!state.trips)state.trips={}; if(state.paynowProxy==null)state.paynowProxy=''; migrateState(); Object.keys(state.trips).forEach(c=>state.trips[c]=normalizeTrip(state.trips[c])); save();
function $(id){return document.getElementById(id)} function save(){localStorage.setItem(LS,JSON.stringify(state))} function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return crypto.randomUUID()} function code(){return Math.random().toString(36).replace(/[^a-z0-9]/gi,'').slice(2,8).toUpperCase()} function money(n){return 'S$'+(Math.round(n*100)/100).toLocaleString('en-SG',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function initials(n){return (n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()} function memberList(t=cur){return Object.entries(t.members||{})} function memberName(id){return cur?.members?.[id]?.name||'Unknown'} function av(id){let m=cur?.members?.[id]||{};return `<div class="av" style="background:${m.avatarColor||colors[0]}">${esc(initials(m.name))}</div>`}
async function api(path,method='GET',body){let r=await fetch(state.api+path,{method,headers:{'Content-Type':'application/json'},body:body&&JSON.stringify(body)});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'API error');return j}
function normalizePayNowProxy(v){v=String(v||'').trim().replace(/\s+/g,'');if(/^\d{8}$/.test(v))return '+65'+v;if(/^65\d{8}$/.test(v))return '+'+v;return v}
function normalizeTrip(t){t=t||{};t.members=t.members||{};t.expenses=t.expenses||[];t.settlements=t.settlements||[];t.currency=t.currency||'SGD';let i=0;Object.entries(t.members).forEach(([id,m])=>{t.members[id]=typeof m==='string'?{name:m,avatarColor:colors[i%colors.length],paynowProxy:''}:{name:m.name||'Unknown',avatarColor:m.avatarColor||colors[i%colors.length],paynowProxy:normalizePayNowProxy(m.paynowProxy||'')};i++});if(!t.ownerId)t.ownerId=Object.keys(t.members)[0]||'';t.expenses.forEach(e=>{e.originalAmount=e.originalAmount??e.amount;e.currency=e.currency||'SGD';e.fxRate=e.fxRate||1;e.splits=e.splits||null});return t}
function migrateState(){let v=+(state.appVersion||0);if(v<14){['TOKYX','DKM8T1','QL6MKH','5B2OYE','S3CMY5','24UUP3','R4EWGL'].forEach(c=>delete state.trips[c]);Object.keys(state.trips).forEach(c=>{let t=state.trips[c];if(t?.name&&/^(Codex|Cycle|Fresh Beta|Beta Share|Tokyo Trip)/i.test(t.name))delete state.trips[c]})}state.appVersion=APP_VERSION}
async function push(t){t=normalizeTrip(t);t.updated_at=new Date().toISOString();state.trips[t.code]=t;save();try{await api('/trips/'+t.code,'PUT',t);toast('Saved')}catch(e){toast('Local only: '+e.message)}}
async function pull(c){let j=await api('/trips/'+c),t=normalizeTrip(j.trip);if(t.deletedAt)throw Error('Trip was deleted');state.trips[c]=t;save();return state.trips[c]}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));scrollTo(0,0)} function goHome(){cur=null;go('home');renderHome()}
function visibleTrips(){return Object.values(state.trips).filter(t=>!t.deletedAt&&t.members&&t.members[state.uid])}
function isOwner(t=cur){return t&&t.ownerId===state.uid}
function renderHome(){ $('hello').textContent='Hi, '+(state.name||'there'); let trips=visibleTrips(); $('tripList').innerHTML=trips.length?trips.map(t=>{let total=tripTotal(t),ms=memberList(t);return `<div class="card trip" onclick="openTrip('${t.code}')"><div class="row"><div class="grow"><div class="screenTitle">${esc(t.name)}</div><div class="muted">${ms.length} members · ${(t.expenses||[]).length} expenses</div></div>${isOwner(t)?'<span class="owner">Owner</span>':''}<span class="code">${t.code}</span></div><div class="row" style="margin-top:16px"><div class="avatars">${ms.slice(0,5).map(([id,m])=>`<div class="av" style="background:${m.avatarColor}">${esc(initials(m.name))}</div>`).join('')}</div><div class="grow"></div><div class="amount">${money(total)}</div></div></div>`}).join(''):'<div class="card muted">No trips yet. Create one or join with a code.</div>'}
function openNewTrip(){modal(`<h2>New trip</h2><input class="field" id="ntName" placeholder="Weekend trip"><div style="height:10px"></div>${selectWrap('ntCur',ccyOptions())}<div style="height:10px"></div><button class="btn" style="width:100%" onclick="createTrip()">Create trip</button>`)}
function createTrip(){let name=$('ntName').value.trim();if(!name)return toast('Trip name needed');if(!state.name)return openSettings(true);let c=code(),id=state.uid;let t={id:uid(),code:c,name,currency:$('ntCur').value.trim().toUpperCase()||'SGD',ownerId:id,members:{[id]:{name:state.name,avatarColor:colors[0],paynowProxy:normalizePayNowProxy(state.paynowProxy)}},expenses:[],settlements:[],updated_at:new Date().toISOString()};closeModal();push(t);openTrip(c,'members')}
function openJoin(prefill=''){modal(`<h2>Join code</h2><input class="field" id="joinCode" placeholder="ABC123" maxlength="6" value="${esc(prefill)}"><div style="height:10px"></div><button class="btn" style="width:100%" onclick="joinTrip()">Join</button>`)}
async function joinTrip(){let c=$('joinCode').value.trim().toUpperCase();if(!c)return;try{let t=await pull(c);if(t.members[state.uid]){closeModal();openTrip(c);return}pendingJoin=t;showJoinChoice(t)}catch(e){toast(e.message)}}
function showJoinChoice(t){let rows=memberList(t).map(([id,m])=>`<div class="expense row">${avFrom(m)}<div class="grow"><b>${esc(m.name)}</b><div class="muted">${m.paynowProxy?'PayNow set':'Member'}</div></div><button class="btn ghost" onclick="claimJoin('${esc(id)}')">This is me</button></div>`).join('');modal(`<h2>Join ${esc(t.name)}</h2><p class="muted">Pick yourself if you are already in this trip. Otherwise join as a new person.</p><div class="card">${rows}</div><button class="btn" style="width:100%" onclick="joinAsNew()">Join as new person</button>`)}
function avFrom(m){return `<div class="av" style="background:${m.avatarColor||colors[0]}">${esc(initials(m.name))}</div>`}
function claimJoin(id){if(!pendingJoin||!pendingJoin.members[id])return;state.uid=id;state.name=pendingJoin.members[id].name||state.name;state.trips[pendingJoin.code]=pendingJoin;save();closeModal();openTrip(pendingJoin.code);toast('Joined as '+state.name)}
async function joinAsNew(){let t=pendingJoin;if(!t)return;if(!state.name)return openSettings(true);t.members[state.uid]={name:state.name,avatarColor:colors[memberList(t).length%colors.length],paynowProxy:normalizePayNowProxy(state.paynowProxy)};await push(t);closeModal();openTrip(t.code)}
function openSettings(first=false){modal(`<h2>${first?'Set up profile':'Edit profile'}</h2><label class="muted">Your name</label><input class="field" id="setName" value="${esc(state.name)}" placeholder="Your name"><div style="height:10px"></div><label class="muted">PayNow proxy</label><input class="field" id="setPayNow" value="${esc(state.paynowProxy||'')}" placeholder="+65 mobile or NRIC"><div style="height:10px"></div><button class="btn" style="width:100%" onclick="saveSettings()">Save profile</button>`)}
async function saveSettings(){let nextName=$('setName').value.trim();if(!nextName)return toast('Name needed');state.name=nextName;state.paynowProxy=normalizePayNowProxy($('setPayNow').value);state.onboarded=true;let touched=[];Object.values(state.trips).forEach(t=>{t=normalizeTrip(t);if(!t.deletedAt&&t.members[state.uid]){t.members[state.uid].name=state.name;t.members[state.uid].paynowProxy=state.paynowProxy;touched.push(t)}});if(cur&&cur.members?.[state.uid]){cur.members[state.uid].name=state.name;cur.members[state.uid].paynowProxy=state.paynowProxy}save();closeModal();cur?renderTrip():renderHome();toast(touched.length?'Profile updated in trips':'Profile saved');if(joinParam&&!cur)setTimeout(()=>openJoin(joinParam.toUpperCase()),150);for(const t of touched)await push(t)}
async function testCloud(){try{let r=await fetch(state.api+'/health'),j=await r.json();toast(j.ok?'Cloud connected':'Cloud replied')}catch(e){toast('Cloud failed: '+e.message)}}
function openTrip(c,start='dashboard'){cur=normalizeTrip(state.trips[c]);state.trips[c]=cur;save();tab=start;go('trip');renderTrip()}
function setTab(t){tab=t;renderTrip()} function renderTrip(){ if(!cur)return; $('tripName').textContent=cur.name; $('tripMeta').textContent=cur.code+' · '+memberList().length+' members'+(isOwner()? ' · Owner':''); let total=tripTotal(),days=tripDays(),pax=memberList().length?total/memberList().length:0; $('statTotal').textContent=money(total);$('statPax').textContent=money(pax);$('statExp').textContent=(cur.expenses||[]).length;$('statDays').textContent=days;$('yourShare').textContent=money(memberShare(state.uid));['dashboard','expenses','balances','members'].forEach(t=>$('tab-'+t).classList.toggle('on',t===tab)); $('tabBody').innerHTML=({dashboard:renderDashboard,expenses:renderExpenses,balances:renderBalances,members:renderMembers}[tab])()}
function tripTotal(t=cur){return (t.expenses||[]).reduce((s,e)=>s+(+e.amount||0),0)} function tripDays(){let ds=(cur.expenses||[]).map(e=>(e.at||'').slice(0,10)).filter(Boolean);return Math.max(1,new Set(ds).size)}
function memberShare(id,t=cur){let n=memberList(t).length||1;return (t.expenses||[]).reduce((s,e)=>s+(e.splits?+(e.splits[id]||0):e.amount/n),0)}
const CCYS=[['SGD','Singapore'],['MYR','Malaysia'],['IDR','Indonesia'],['THB','Thailand'],['VND','Vietnam'],['PHP','Philippines'],['JPY','Japan'],['KRW','South Korea'],['TWD','Taiwan'],['HKD','Hong Kong'],['CNY','China'],['USD','United States'],['EUR','Eurozone'],['GBP','United Kingdom'],['AUD','Australia'],['NZD','New Zealand'],['CAD','Canada'],['CHF','Switzerland'],['INR','India']];
function ccyOptions(sel='SGD'){return CCYS.map(([c,place])=>`<option value="${c}" ${c===sel?'selected':''}>${c} - ${place}</option>`).join('')}
function selectWrap(id,options,attrs=''){return `<label class="selectWrap"><select class="field" id="${id}" ${attrs}>${options}</select></label>`}
function paidOptions(sel=''){return memberList().map(([id,m])=>`<option value="${id}" ${id===sel?'selected':''}>${esc(m.name)}</option>`).join('')}
function splitBox(e=null,p=''){let mode=e?.splitMode||(e?.splits?'custom':'equal'),ids=memberList().map(([id])=>id),selected=ids.filter(id=>!e?.splits||+e.splits[id]>0);let pick=memberList().map(([id,m])=>`<label class="checkrow"><input type="checkbox" class="splitPick" data-mid="${id}" ${selected.includes(id)?'checked':''}><span>${esc(m.name)}</span></label>`).join('');let rows=memberList().map(([id,m])=>`<div class="row" style="margin-top:8px"><div class="grow">${esc(m.name)}</div><input class="field splitAmt" data-mid="${id}" value="${mode==='custom'?(e?.splits?.[id]??''):''}" placeholder="0.00" style="width:110px"></div>`).join('');return `<div class="fxbox"><div class="k">Split mode</div><div class="seg"><label><input type="radio" name="${p}splitMode" value="equal" ${mode==='equal'?'checked':''} onchange="splitChanged('${p}')"><span>Equal</span></label><label><input type="radio" name="${p}splitMode" value="selected" ${mode==='selected'?'checked':''} onchange="splitChanged('${p}')"><span>Selected</span></label><label><input type="radio" name="${p}splitMode" value="custom" ${mode==='custom'?'checked':''} onchange="splitChanged('${p}')"><span>Custom</span></label></div><div id="${p}pickRows" class="checkgrid ${mode==='selected'?'':'hidden'}">${pick}</div><div id="${p}splitRows" class="splitCustom ${mode==='custom'?'':'hidden'}">${rows}</div></div>`}
function splitMode(p=''){return document.querySelector(`input[name="${p}splitMode"]:checked`)?.value||'equal'}
function splitChanged(p=''){let m=splitMode(p),rows=$(p+'splitRows'),pick=$(p+'pickRows');if(rows)rows.classList.toggle('hidden',m!=='custom');if(pick)pick.classList.toggle('hidden',m!=='selected')}
function collectSplits(total,p=''){let m=splitMode(p);if(m==='equal')return {mode:'equal',splits:null};let out={},sum=0;if(m==='selected'){let ids=[...document.querySelectorAll(`#${p}pickRows .splitPick:checked`)].map(i=>i.dataset.mid);if(!ids.length){toast('Select at least one person');return false}let each=total/ids.length;memberList().forEach(([id])=>out[id]=ids.includes(id)?each:0);return {mode:'selected',splits:out}}document.querySelectorAll(`#${p}splitRows .splitAmt`).forEach(i=>{let v=+i.value||0;out[i.dataset.mid]=v;sum+=v});if(Math.abs(sum-total)>0.01){toast('Custom split must total '+money(total));return false}return {mode:'custom',splits:out}}
function splitLabel(e){if(e.splitMode==='selected')return 'selected split';return e.splits?'custom split':money(e.amount/memberList().length)+'/pax'}
function renderExpenses(){return `<div class="card"><div class="row"><button class="btn ghost" onclick="$('receipt').click()">📷</button><input class="field" id="desc" placeholder="Expense description..."></div><input id="receipt" type="file" accept="image/*" class="hidden" onchange="previewReceipt(event)"><div id="receiptPreview"></div><div class="grid2" style="margin:10px 0"><input class="field" id="amt" type="number" step="0.01" placeholder="Amount">${selectWrap('curSel',ccyOptions(),'onchange="fxChanged()"')}</div><div id="fxPanel"></div>${selectWrap('paidBy',paidOptions())}${splitBox()}<div style="height:10px"></div><button class="btn" style="width:100%" onclick="addExpense()">+ Add expense</button></div><div class="card">${(cur.expenses||[]).slice().reverse().map(e=>`<div class="expense row">${e.receiptUrl?`<img class="thumb" src="${e.receiptUrl}">`:av(e.paidBy)}<div class="grow"><b>${esc(e.desc)}</b><div class="muted">${esc(memberName(e.paidBy))} · ${splitLabel(e)} ${e.currency!=='SGD'?`· ${e.currency} ${e.originalAmount}`:''}</div></div><div style="text-align:right"><div class="amount">${money(e.amount)}</div><button class="btn ghost" style="padding:7px 10px;margin-top:5px" onclick="openEditExpense('${e.id}')">Edit</button><button class="btn ghost" style="padding:7px 10px;margin-top:5px" onclick="delExp('${e.id}')">Delete</button></div></div>`).join('')||'<div class="muted">No expenses yet.</div>'}</div>`}
async function fxChanged(){let c=$("curSel").value;if(c==="SGD"){$("fxPanel").innerHTML="";return}let fx=await getRate(c),rate=fx.rate;$("fxPanel").innerHTML=`<div class="fxbox"><div class="row"><div><div class="k">Exchange rate</div><b>1 ${c} = ${rate.toFixed(5)} SGD</b><div class="muted">${esc(fx.source)} · editable</div></div><div class="grow"></div><input class="field" id="fxRate" value="${rate}" style="width:120px"></div></div>`}
function fallbackRate(from){return ({JPY:.0087,MYR:.285,IDR:.000083,THB:.041,VND:.000052,PHP:.023,KRW:.00098,TWD:.0415,HKD:.173,CNY:.187,USD:1.35,EUR:1.56,GBP:1.8,AUD:.87,NZD:.81,CAD:.98,CHF:1.66,INR:.016})[from]||1}
async function getRate(from){let key="fx_"+from+"_SGD",cached=JSON.parse(localStorage.getItem(key)||"null");if(cached&&Date.now()-cached.at<86400000&&isFinite(cached.rate)&&cached.rate>0)return {rate:+cached.rate,source:"Cached rate"};return {rate:fallbackRate(from),source:"Fallback estimate"}}
function previewReceipt(e){let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);$('receiptPreview').innerHTML=`<div class="fxbox row"><img class="thumb" src="${url}"><div><b>Receipt attached</b><div class="muted">OCR placeholder: review details manually</div></div></div>`}
async function addExpense(){let d=$('desc').value.trim(),raw=+$('amt').value,ccy=$('curSel').value;if(!d||!raw)return toast('Description and amount needed');let rate=ccy==='SGD'?1:+(($('fxRate')||{}).value||1),sgd=ccy==='SGD'?raw:raw*rate,split=collectSplits(sgd);if(split===false)return;cur.expenses.push({id:uid(),desc:d,amount:sgd,originalAmount:raw,currency:ccy,fxRate:rate,paidBy:$('paidBy').value,splitMode:split.mode,splits:split.splits,receiptUrl:null,at:new Date().toISOString()});await push(cur);renderTrip()}
function openEditExpense(id){let e=cur.expenses.find(x=>x.id===id);if(!e)return;modal(`<h2>Edit expense</h2><input class="field" id="edDesc" value="${esc(e.desc)}"><div class="grid2" style="margin:10px 0"><input class="field" id="edAmt" type="number" step="0.01" value="${esc(e.originalAmount)}">${selectWrap('edCur',ccyOptions(e.currency))}</div>${selectWrap('edPaidBy',paidOptions(e.paidBy))}${splitBox(e,'ed')}<div style="height:10px"></div><button class="btn" style="width:100%" onclick="saveExpenseEdit('${id}')">Save expense</button>`)}
async function saveExpenseEdit(id){let e=cur.expenses.find(x=>x.id===id),raw=+$('edAmt').value,ccy=$('edCur').value,d=$('edDesc').value.trim();if(!e||!d||!raw)return toast('Description and amount needed');let rate=ccy==='SGD'?1:(ccy===e.currency?+e.fxRate:fallbackRate(ccy))||1,sgd=ccy==='SGD'?raw:raw*rate,split=collectSplits(sgd,'ed');if(split===false)return;Object.assign(e,{desc:d,amount:sgd,originalAmount:raw,currency:ccy,fxRate:rate,paidBy:$('edPaidBy').value,splitMode:split.mode,splits:split.splits});closeModal();await push(cur);renderTrip()}
function delExp(id){cur.expenses=cur.expenses.filter(e=>e.id!==id);push(cur);renderTrip()}
function balances(includeSettled=true){let ids=memberList().map(([id])=>id),b={};ids.forEach(id=>b[id]=0);(cur.expenses||[]).forEach(e=>{ids.forEach(id=>b[id]-=e.splits?+(e.splits[id]||0):e.amount/ids.length);b[e.paidBy]=(b[e.paidBy]||0)+e.amount});if(includeSettled)(cur.settlements||[]).filter(s=>s.paidAt).forEach(s=>{b[s.from]+=s.amount;b[s.to]-=s.amount});return b}
function transfers(){let b=balances(),debt=[],cred=[];Object.entries(b).forEach(([id,a])=>{if(a<-0.005)debt.push({id,a:-a});if(a>0.005)cred.push({id,a})});debt.sort((a,b)=>b.a-a.a);cred.sort((a,b)=>b.a-a.a);let out=[],i=0,j=0;while(i<debt.length&&j<cred.length){let a=Math.min(debt[i].a,cred[j].a);out.push({from:debt[i].id,to:cred[j].id,amount:a});debt[i].a-=a;cred[j].a-=a;if(debt[i].a<.005)i++;if(cred[j].a<.005)j++}return out}
function renderBalances(){let b=balances(),trs=transfers();return `<div class="card"><div class="k">Net balances</div>${memberList().map(([id,m])=>`<div class="expense row">${av(id)}<div class="grow"><b>${esc(m.name)}</b></div><div class="amount ${b[id]>=0?'good':'badTxt'}">${b[id]>=0?'+':'-'}${money(Math.abs(b[id]))}</div></div>`).join('')}</div><div class="card"><div class="k">Settle up</div>${trs.map((tr,i)=>`<div class="pay row" onclick="openSettle(${i})">${av(tr.from)}<div class="grow">${esc(memberName(tr.from))} → <b>${esc(memberName(tr.to))}</b></div><b class="good">${money(tr.amount)}</b></div>`).join('')||'<div class="muted">All settled.</div>'}</div>`}
function ownerTools(){return isOwner()?`<div class="grid2" style="margin-bottom:12px"><button class="btn ghost" onclick="openTripEdit()">Edit trip</button><button class="btn bad" onclick="openTripDelete()">Delete trip</button></div>`:''}
function renderMembers(){return `${ownerTools()}<div class="card row"><input class="field" id="memberName" placeholder="Member name"><input class="field" id="paynow" placeholder="PayNow proxy (optional)"><button class="btn" onclick="addMember()">Add</button></div><div class="card">${memberList().map(([id,m])=>{let paid=(cur.expenses||[]).filter(e=>e.paidBy===id).reduce((s,e)=>s+e.amount,0);return `<div class="expense row">${av(id)}<div class="grow"><b>${esc(m.name)}</b><div class="muted">${id===state.uid?'You · This device':'Member'}${id===cur.ownerId?' · Owner':''}${m.paynowProxy?' · PayNow set':''}</div></div><div class="amount">${money(paid)}<br><span class="muted" style="font-size:.8rem">paid</span></div></div>`}).join('')}</div>`}
function addMember(){let n=$('memberName').value.trim();if(!n)return;cur.members['m_'+uid()]={name:n,avatarColor:colors[memberList().length%colors.length],paynowProxy:normalizePayNowProxy($('paynow').value)};push(cur);renderTrip()}
function openTripEdit(){if(!isOwner())return toast('Only the owner can edit this trip');modal(`<h2>Edit trip</h2><label class="muted">Trip name</label><input class="field" id="editTripName" value="${esc(cur.name)}"><div style="height:10px"></div><label class="muted">Default currency</label>${selectWrap('editTripCur',ccyOptions(cur.currency))}<div style="height:10px"></div><button class="btn" style="width:100%" onclick="saveTripEdit()">Save trip</button>`)}
async function saveTripEdit(){if(!isOwner())return;let name=$('editTripName').value.trim();if(!name)return toast('Trip name needed');cur.name=name;cur.currency=$('editTripCur').value;closeModal();await push(cur);renderTrip()}
function openTripDelete(){if(!isOwner())return toast('Only the owner can delete this trip');modal(`<h2>Delete trip?</h2><p class="muted">This hides the trip for everyone using this build. The shared backend keeps a small deletion marker so old invite links stop reopening it.</p><button class="btn bad" style="width:100%" onclick="confirmDeleteTrip()">Delete trip</button><button class="btn ghost" style="width:100%;margin-top:10px" onclick="closeModal()">Keep trip</button>`)}
async function confirmDeleteTrip(){if(!isOwner())return;cur.deletedAt=new Date().toISOString();cur.deletedBy=state.uid;await push(cur);delete state.trips[cur.code];save();closeModal();toast('Trip deleted');goHome()}
function renderDashboard(){let total=tripTotal(),b=balances(),paidBy={};memberList().forEach(([id])=>paidBy[id]=0);(cur.expenses||[]).forEach(e=>paidBy[e.paidBy]=(paidBy[e.paidBy]||0)+e.amount);let max=Math.max(...Object.values(b).map(Math.abs),1),days={};(cur.expenses||[]).forEach(e=>{let d=(e.at||'').slice(0,10);days[d]=(days[d]||0)+e.amount});let maxDay=Math.max(...Object.values(days),1);return `<div class="grid2"><div class="card"><div class="k">Who paid</div><div class="donut" data-label="${money(total)}"></div>${memberList().map(([id,m],i)=>`<div><span class="dot" style="background:${['var(--accent)','var(--blue)','var(--warn)','#e95832'][i%4]}"></span>${esc(m.name)} <b style="float:right">${money(paidBy[id]||0)}</b></div>`).join('')}</div><div class="card"><div class="k">Net balance</div>${memberList().map(([id,m])=>`<div class="balanceRow"><div>${esc(m.name)}</div><div class="bar"><div class="fill" style="width:${Math.abs(b[id]||0)/max*100}%;background:${(b[id]||0)>=0?'var(--accent)':'var(--bad)'}"></div></div><b class="${(b[id]||0)>=0?'good':'badTxt'}">${(b[id]||0)>=0?'+':'-'}${money(Math.abs(b[id]||0))}</b></div>`).join('')}<hr style="border-color:#4a4b45"><div class="k">Settle up</div>${transfers().slice(0,3).map(tr=>`<div class="pay">${esc(memberName(tr.from))} → ${esc(memberName(tr.to))}<b class="good" style="float:right">${money(tr.amount)}</b></div>`).join('')||'<div class="muted">All settled.</div>'}</div></div><div class="card"><div class="row"><div><div class="k">Daily spending</div><div class="muted">avg ${money(total/tripDays())}/day</div></div></div><div class="chart">${Object.values(days).length?Object.values(days).map(v=>`<div class="col" style="height:${Math.max(3,v/maxDay*100)}%"></div>`).join(''):'<div class="muted">No spend yet.</div>'}</div></div>`}
function tlv(id,v){v=String(v);return id+String(v.length).padStart(2,'0')+v}
function crc16(raw){let crc=0xFFFF;for(let i=0;i<raw.length;i++){crc^=raw.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1)}return crc&0xFFFF}
function buildPayNowQR(proxy,amount,name){proxy=normalizePayNowProxy(proxy);let type=proxy.startsWith('+65')?'0':'2',mai=tlv('00','SG.PAYNOW')+tlv('01',type)+tlv('02',proxy)+tlv('03','0');let raw=[tlv('00','01'),tlv('01','12'),tlv('26',mai),tlv('52','0000'),tlv('53','702'),tlv('54',(+amount).toFixed(2)),tlv('58','SG'),tlv('59',(name||'PAYNOW').slice(0,25)),tlv('60','Singapore'),'6304'].join('');return raw+crc16(raw).toString(16).toUpperCase().padStart(4,'0')}
function openSettle(i){settleTarget=transfers()[i];$('payFromAv').outerHTML=av(settleTarget.from).replace('class="av"','class="av" id="payFromAv"');$('payToAv').outerHTML=av(settleTarget.to).replace('class="av"','class="av" id="payToAv"');$('payFromName').textContent=memberName(settleTarget.from)+' owes';$('payToName').textContent='to '+memberName(settleTarget.to);$('payAmt').textContent=money(settleTarget.amount);let payee=cur.members[settleTarget.to];$('payCard').innerHTML=payee.paynowProxy?`<div class="k">PayNow QR</div><div id="qr" class="qr"></div><div style="text-align:center" class="muted">Scan with PayNow<br><b class="good">${esc(normalizePayNowProxy(payee.paynowProxy))}</b><br>${esc(money(settleTarget.amount))}</div>`:`<div class="k">Declaration mode</div><p class="muted">${esc(memberName(settleTarget.to))} has no PayNow proxy yet. Mark as paid after transferring manually.</p>`;go('settle');setTimeout(()=>{if(payee.paynowProxy&&window.QRCode)new QRCode($('qr'),{text:buildPayNowQR(payee.paynowProxy,settleTarget.amount,memberName(settleTarget.to)),width:116,height:116})},50)}
function markPaid(){if(!settleTarget)return;cur.settlements.push({...settleTarget,paidAt:new Date().toISOString()});push(cur);$('paidText').textContent=`${money(settleTarget.amount)} · ${memberName(settleTarget.from)} → ${memberName(settleTarget.to)}`;let total=cur.settlements.length+transfers().length;$('paidProgress').innerHTML=`<div class="card" style="text-align:left"><div class="k">Trip progress</div><div class="v">${cur.settlements.length} of ${total} settled</div><div class="bar"><div class="fill" style="width:${total?cur.settlements.length/total*100:100}%"></div></div></div>`;go('paid')}
function tripUrl(){return location.origin+location.pathname+'?join='+cur.code}
function shareTrip(){shareNative(tripUrl())}
function openShare(){shareTrip()}
async function shareNative(url){let msg='Join my SplitLah trip '+cur.name+': '+url;if(navigator.share){try{await navigator.share({title:'SplitLah trip '+cur.code,text:msg,url});return}catch(e){if(e.name==='AbortError')return}}copyShare(url)}
async function copyShare(url){try{await navigator.clipboard.writeText(url);toast('Invite copied')}catch(e){toast('Copy failed')}}
function modal(html){$('modalBody').innerHTML=html;$('modal').classList.add('on')} function closeModal(){$('modal').classList.remove('on')}
renderHome();if(!state.onboarded)setTimeout(()=>openSettings(true),100);else if(joinParam)setTimeout(()=>openJoin(joinParam.toUpperCase()),100);
</script>
</body>
