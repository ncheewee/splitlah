<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SplitLah MVP</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#17202a;background:#f6f7f9;font-size:15px}
*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:0 auto;min-height:100vh;background:#fff}.hero{background:linear-gradient(150deg,#e85d38,#b5341f);color:#fff;padding:22px 18px 28px}.top{display:flex;gap:10px;align-items:center}.grow{flex:1}.logo{font-size:1.5rem;font-weight:800}.muted{color:#7b8492}.hero .muted{color:rgba(255,255,255,.75)}button,input,select{font:inherit}button{border:0;border-radius:10px;background:#e85d38;color:#fff;padding:10px 13px;font-weight:700}button.secondary{background:#eef0f4;color:#27313d}button.ghost{background:rgba(255,255,255,.16);color:#fff}.body{padding:14px}.card{border:1px solid #e6e8ec;border-radius:12px;padding:13px;margin:10px 0;background:#fff;box-shadow:0 2px 10px rgba(20,30,40,.04)}.row{display:flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{width:100%;border:1px solid #d9dde3;border-radius:10px;padding:10px;background:#fff}.tabs{display:flex;border-bottom:1px solid #e6e8ec}.tab{flex:1;background:#fff;color:#7b8492;border-radius:0}.tab.on{color:#e85d38;border-bottom:3px solid #e85d38}.hide{display:none}.small{font-size:.82rem}.right{text-align:right}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:#f1f3f6;font-size:.78rem}.good{color:#07875b}.bad{color:#c22b2b}.list button{width:100%;text-align:left;background:#fff;color:#17202a;border:1px solid #e6e8ec;margin:6px 0}.split{display:flex;justify-content:space-between;gap:8px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 14px;border-radius:10px;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="top">
      <div class="grow"><div class="logo">SplitLah</div><div class="muted small" id="sub">Neon MVP</div></div>
      <button class="ghost" onclick="showSetup()">Setup</button>
    </div>
  </div>
  <div id="setup" class="body">
    <div class="card">
      <h3>Setup</h3>
      <p class="muted small">GitHub hosts this file. A Cloudflare Worker saves trips to Neon.</p>
      <input id="meName" class="field" placeholder="Your name">
      <div style="height:8px"></div>
      <input id="apiUrl" class="field" placeholder="Worker API URL, e.g. https://splitlah-api.yourname.workers.dev">
      <div style="height:10px"></div>
      <button onclick="saveSetup()">Save</button>
    </div>
  </div>
  <div id="home" class="body hide">
    <div class="grid">
      <button onclick="newTrip()">+ New Trip</button>
      <button class="secondary" onclick="joinTrip()">Join Code</button>
    </div>
    <div id="trips" class="list"></div>
  </div>
  <div id="trip" class="hide">
    <div class="body">
      <button class="secondary" onclick="goHome()">Back to trips</button>
      <div class="card">
        <div class="split"><h2 id="tName"></h2><span class="pill" id="tCode"></span></div>
        <div class="muted small" id="tMeta"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="tab('expenses')">Expenses</button>
      <button class="tab" onclick="tab('balances')">Balances</button>
      <button class="tab" onclick="tab('members')">Members</button>
    </div>
    <div id="expenses" class="body">
      <div class="card">
        <input id="eDesc" class="field" placeholder="Expense">
        <div style="height:8px"></div>
        <div class="row"><input id="eAmt" class="field" type="number" step="0.01" placeholder="Amount"><select id="ePaid" class="field"></select></div>
        <div style="height:8px"></div>
        <button onclick="addExpense()">Add expense</button>
      </div>
      <div id="eList"></div>
    </div>
    <div id="balances" class="body hide"><div id="bList"></div></div>
    <div id="members" class="body hide">
      <div class="card">
        <input id="mName" class="field" placeholder="Member name">
        <div style="height:8px"></div><button onclick="addMember()">Add member</button>
      </div>
      <div id="mList"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const LS='sl_mvp_v2',uid=localStorage.sl_uid||(localStorage.sl_uid='u_'+crypto.randomUUID());
let cfg=JSON.parse(localStorage[LS]||'{}'),trips=cfg.trips||{},cur=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function save(){cfg.trips=trips;localStorage[LS]=JSON.stringify(cfg)}
function showSetup(){$('setup').classList.remove('hide');$('home').classList.add('hide');$('trip').classList.add('hide');$('meName').value=cfg.name||'';$('apiUrl').value=cfg.api||''}
function saveSetup(){cfg.name=$('meName').value.trim()||'Me';cfg.api=$('apiUrl').value.trim().replace(/\/$/,'');save();goHome()}
function goHome(){$('setup').classList.add('hide');$('trip').classList.add('hide');$('home').classList.remove('hide');renderHome()}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function blankTrip(name){let c=code();return{id:crypto.randomUUID(),code:c,name,currency:'SGD',members:{[uid]:cfg.name||'Me'},expenses:[],updated_at:new Date().toISOString()}}
async function api(path,method='GET',body){if(!cfg.api)throw Error('Missing Worker API URL');let r=await fetch(cfg.api+path,{method,headers:{'Content-Type':'application/json'},body:body&&JSON.stringify(body)});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'API error');return j}
async function push(t){t.updated_at=new Date().toISOString();trips[t.code]=t;save();try{await api('/trips/'+t.code,'PUT',t);toast('Saved')}catch(e){toast('Saved locally: '+e.message)}}
async function pull(c){let j=await api('/trips/'+c);trips[c]=j.trip;save();return j.trip}
function renderHome(){let arr=Object.values(trips);$('trips').innerHTML=arr.length?arr.map(t=>'<button onclick="openTrip(\''+t.code+'\')"><b>'+esc(t.name)+'</b><br><span class="muted small">'+t.code+' - '+Object.keys(t.members).length+' members - '+t.expenses.length+' expenses</span></button>').join(''):'<div class="card muted">No trips yet.</div>'}
async function newTrip(){let n=prompt('Trip name?');if(!n)return;let t=blankTrip(n);await push(t);openTrip(t.code)}
async function joinTrip(){let c=(prompt('Trip code?')||'').trim().toUpperCase();if(!c)return;try{let t=await pull(c);if(!t.members[uid]){t.members[uid]=cfg.name||'Me';await push(t)}openTrip(c)}catch(e){toast(e.message)}}
function openTrip(c){cur=trips[c];$('home').classList.add('hide');$('trip').classList.remove('hide');tab('expenses');renderTrip()}
function tab(x){['expenses','balances','members'].forEach(id=>$(id).classList.toggle('hide',id!==x));document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',['expenses','balances','members'][i]===x));renderTrip()}
function renderTrip(){if(!cur)return;$('tName').textContent=cur.name;$('tCode').textContent=cur.code;$('tMeta').textContent=Object.keys(cur.members).length+' members - '+cur.expenses.length+' expenses';$('ePaid').innerHTML=Object.entries(cur.members).map(([id,n])=>'<option value="'+id+'">'+esc(n)+'</option>').join('');renderExpenses();renderBalances();renderMembers()}
function addExpense(){let d=$('eDesc').value.trim(),a=+$('eAmt').value,p=$('ePaid').value;if(!d||!a)return toast('Need expense and amount');cur.expenses.push({id:crypto.randomUUID(),desc:d,amount:a,paidBy:p,at:new Date().toISOString()});$('eDesc').value='';$('eAmt').value='';push(cur);renderTrip()}
function delExpense(id){cur.expenses=cur.expenses.filter(e=>e.id!==id);push(cur);renderTrip()}
function renderExpenses(){$('eList').innerHTML=cur.expenses.length?cur.expenses.slice().reverse().map(e=>'<div class="card split"><div><b>'+esc(e.desc)+'</b><div class="muted small">paid by '+esc(cur.members[e.paidBy]||'?')+'</div></div><div class="right"><b>S$'+e.amount.toFixed(2)+'</b><br><button class="secondary small" onclick="delExpense(\''+e.id+'\')">Delete</button></div></div>').join(''):'<div class="card muted">No expenses.</div>'}
function balances(){let ids=Object.keys(cur.members),b={};ids.forEach(id=>b[id]=0);cur.expenses.forEach(e=>{let share=e.amount/ids.length;ids.forEach(id=>b[id]-=share);b[e.paidBy]+=e.amount});return b}
function renderBalances(){let b=balances(),ids=Object.keys(b),debt=ids.filter(i=>b[i]<-.005).map(i=>({i,a:-b[i]})),cred=ids.filter(i=>b[i]>.005).map(i=>({i,a:b[i]})),out=[];debt.sort((a,b)=>b.a-a.a);cred.sort((a,b)=>b.a-a.a);let i=0,j=0;while(i<debt.length&&j<cred.length){let a=Math.min(debt[i].a,cred[j].a);out.push([debt[i].i,cred[j].i,a]);debt[i].a-=a;cred[j].a-=a;if(debt[i].a<.005)i++;if(cred[j].a<.005)j++}$('bList').innerHTML=ids.map(id=>'<div class="card split"><b>'+esc(cur.members[id])+'</b><b class="'+(b[id]>=0?'good':'bad')+'">'+(b[id]>=0?'+':'-')+'S$'+Math.abs(b[id]).toFixed(2)+'</b></div>').join('')+(out.length?'<h3>Pay</h3>'+out.map(x=>'<div class="card">'+esc(cur.members[x[0]])+' pays <b>'+esc(cur.members[x[1]])+'</b> S$'+x[2].toFixed(2)+'</div>').join(''):'<div class="card good">All square.</div>')}
function addMember(){let n=$('mName').value.trim();if(!n)return;cur.members['m_'+crypto.randomUUID()]=n;$('mName').value='';push(cur);renderTrip()}
function renderMembers(){$('mList').innerHTML=Object.values(cur.members).map(n=>'<div class="card">'+esc(n)+'</div>').join('')}
if(cfg.name)goHome();else showSetup();
</script>
</body>
</html>
