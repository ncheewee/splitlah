<main class="app">
  <section id="home" class="view on">
    <div class="homeHead">
      <div class="brand">SPLITLAH · CLAUDE (v30)</div>
      <div class="row"><div class="h1 grow" id="hello">Hi there</div><button class="navChip" onclick="openSettings()">EDIT PROFILE</button></div>
      <div class="sub">Your trips</div>
      <div class="grid2" style="margin-top:22px"><button class="btn" onclick="openNewTrip()">+ New trip</button><button class="btn sec" onclick="openJoin()">Join code</button></div>
    </div>
    <div class="body" id="tripList"></div>
  </section>
  <section id="trip" class="view">
    <header class="head">
      <div class="topActions"><button class="navChip" onclick="goHome()">BACK TO TRIPS</button><button class="navChip shareTop" onclick="shareTrip()">SHARE TRIP</button></div>
      <div class="brand">SPLITLAH · CLAUDE (v30)</div>
      <div class="top"><div><div class="row titleRow"><div class="h1 grow" id="tripName">Trip</div><button class="editChip hidden" id="tripEditTop" style="align-self:center;margin-top:2px" onclick="openTripEdit()">EDIT</button></div><div class="sub tripMeta" id="tripMeta">CODE</div></div><div class="share"><div class="k">Your share</div><b id="yourShare">S$0</b></div></div>
      <div class="stats"><div class="stat"><div class="k">Total</div><div class="v" id="statTotal">S$0</div></div><div class="stat"><div class="k">Avg/person</div><div class="v" id="statPax">S$0</div></div></div>
      <nav class="tabs"><button class="tab" id="tab-dashboard" onclick="setTab('dashboard')">Dashboard</button><button class="tab" id="tab-expenses" onclick="setTab('expenses')">Expenses</button><button class="tab" id="tab-balances" onclick="setTab('balances')">Settle</button><button class="tab" id="tab-members" onclick="setTab('members')">Members</button></nav>
    </header>
    <div class="body">
      <div id="tabBody"></div>
      <button class="fabExpense" onclick="openExpenseForm()">ADD EXPENSE</button>
    </div>
  </section>
  <section id="settle" class="view">
    <div class="head" style="padding-bottom:26px"><button class="btn ghost" onclick="openTrip(cur.code,'balances')">Back</button><div class="h1">Settle up</div><div class="row" style="margin-top:16px"><div class="av" id="payFromAv"></div><div class="grow"><div class="sub" id="payFromName">Payer owes</div><div class="h1" id="payAmt">S$0</div><div class="sub" id="payToName" style="text-align:right">to payee</div></div><div class="av" id="payToAv"></div></div></div>
    <div class="body"><div class="card" id="payCard"></div><button class="btn" style="width:100%" onclick="markPaid()">Mark as paid</button></div>
  </section>
  <section id="paid" class="view">
    <div class="head" style="padding-bottom:18px"><button class="btn ghost" onclick="openTrip(cur.code,'balances')">Back</button><div class="h1">Settle up</div></div>
    <div class="body" style="text-align:center"><div class="check">✓</div><div class="screenTitle">Payment recorded</div><div class="muted" id="paidText" style="margin:8px 0 24px"></div><div id="paidProgress"></div><button class="btn ghost" style="width:100%" onclick="openTrip(cur.code,'dashboard')">Back to trip</button></div>
  </section>
</main>

<script>
(function(){const th=localStorage.getItem('sl_theme');const fs=localStorage.getItem('sl_fs');if(th==='light')document.body.classList.add('light');if(fs)document.documentElement.style.setProperty('--fs',fs+'px')})();
const API_DEFAULT='https://splitlah-api.ncheewee.workers.dev',LS='sl_codex_v1',APP_VERSION=31;

let params=new URLSearchParams(location.search),state=JSON.parse(localStorage.getItem(LS)||'{}'),cur=null,tab='dashboard',settleTarget=null,pendingJoin=null,joinParam=params.get('join'),memberParam=params.get('member'),adminParam=params.get('admin'),installPrompt=null,pendingReceiptUrl=null;

    const left=lx<CX,anchor=left?'end':'start',tx=left?lx-5:lx+5;
    const pstr=(seg.pct>=10?Math.round(seg.pct):seg.pct.toFixed(1))+'%';
    return`<line x1="${f(ex)}" y1="${f(ey)}" x2="${f(lx)}" y2="${f(ly)}" stroke="${seg.m.avatarColor}" stroke-width="1.5" opacity=".65"/>
<circle cx="${f(lx)}" cy="${f(ly)}" r="2.5" fill="${seg.m.avatarColor}" opacity=".8"/>
<text x="${f(tx)}" y="${f(ly-4)}" text-anchor="${anchor}" fill="${seg.m.avatarColor}" font-size="9.5" font-weight="700" font-family="system-ui,sans-serif">${esc(initials(seg.m.name))} · ${pstr}</text>
<text x="${f(tx)}" y="${f(ly+7)}" text-anchor="${anchor}" fill="${seg.m.avatarColor}" font-size="8.5" font-weight="600" font-family="system-ui,sans-serif" opacity=".9">${money(seg.amt)}</text>`;
  }).join('');
  return`<div class="k" style="margin-bottom:10px">Who paid</div><svg viewBox="0 0 296 236" style="width:100%;max-height:236px" overflow="visible">${paths}${lines}<text x="${CX}" y="${CY-6}" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700" font-family="system-ui,sans-serif">${money(total)}</text><text x="${CX}" y="${CY+9}" text-anchor="middle" fill="var(--muted)" font-size="8" font-weight="700" letter-spacing="1" font-family="system-ui,sans-serif">TOTAL</text></svg>`;
}

function renderDashboard(){let total=tripTotal(),b=balances(),paidBy={};memberList().forEach(([id])=>paidBy[id]=0);(cur.expenses||[]).forEach(e=>paidBy[e.paidBy]=(paidBy[e.paidBy]||0)+e.amount);let max=Math.max(...Object.values(b).map(Math.abs),1);return `<div class="card">${renderWhoPaid(paidBy,total)}</div><div class="card"><div class="k">Net balance</div><div class="dashList">${memberList().map(([id,m])=>`<div class="balanceRow"><div class="row"><div class="grow">${esc(m.name)}</div><b class="${(b[id]||0)>=0?'good':'badTxt'}">${(b[id]||0)>=0?'+':'-'}${money(Math.abs(b[id]||0))}</b></div><div class="bar"><div class="fill" style="width:${Math.abs(b[id]||0)/max*100}%;background:${(b[id]||0)>=0?'var(--accent)':'var(--bad)'}"></div></div></div>`).join('')}</div></div>${renderSpendChart()}`}
function tlv(id,v){v=String(v);return id+String(v.length).padStart(2,'0')+v}
function crc16(raw){let crc=0xFFFF;for(let i=0;i<raw.length;i++){crc^=raw.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1)}return crc&0xFFFF}
function buildPayNowQR(proxy,amount,name){proxy=normalizePayNowProxy(proxy);let type=proxy.startsWith('+65')?'0':'2',mai=tlv('00','SG.PAYNOW')+tlv('01',type)+tlv('02',proxy)+tlv('03','0');let raw=[tlv('00','01'),tlv('01','12'),tlv('26',mai),tlv('52','0000'),tlv('53','702'),tlv('54',(+amount).toFixed(2)),tlv('58','SG'),tlv('59',(name||'PAYNOW').slice(0,25)),tlv('60','Singapore'),'6304'].join('');return raw+crc16(raw).toString(16).toUpperCase().padStart(4,'0')}
function openSettle(i,hist=true){settleTarget=transfers()[i];$('payFromAv').outerHTML=av(settleTarget.from).replace('class="av"','class="av" id="payFromAv"');$('payToAv').outerHTML=av(settleTarget.to).replace('class="av"','class="av" id="payToAv"');$('payFromName').textContent=memberName(settleTarget.from)+' owes';$('payToName').textContent='to '+memberName(settleTarget.to);$('payAmt').textContent=money(settleTarget.amount);let payee=cur.members[settleTarget.to];$('payCard').innerHTML=payee.paynowProxy?`<div class="k">PayNow QR</div><div class="qrHint"><div class="qrFrame"><div id="qr" class="qr" onclick="saveQrImage()"></div></div></div><button class="btn ghost" style="width:100%" onclick="saveQrImage()">Save QR image</button><div style="text-align:center;margin-top:10px" class="muted">Scan with PayNow<br><b class="good">${esc(normalizePayNowProxy(payee.paynowProxy))}</b><br>${esc(money(settleTarget.amount))}</div>`:`<div class="k">Declaration mode</div><p class="muted">${esc(memberName(settleTarget.to))} has no PayNow proxy yet. Mark as paid after transferring manually.</p>`;go('settle');if(hist&&cur)pushNav({view:'settle',code:cur.code,tab:'balances'});setTimeout(()=>{if(payee.paynowProxy&&window.QRCode){new QRCode($('qr'),{text:buildPayNowQR(payee.paynowProxy,settleTarget.amount,memberName(settleTarget.to)),width:320,height:320})}},50)}
function saveQrImage(){let el=$('qr')?.querySelector('canvas,img');if(!el)return toast('QR not ready');let out=document.createElement('canvas'),size=1024,border=72,quiet=96;out.width=size;out.height=size;let ctx=out.getContext('2d');ctx.fillStyle='#1d9e75';ctx.fillRect(0,0,size,size);ctx.fillStyle='#fff';ctx.fillRect(border,border,size-border*2,size-border*2);ctx.drawImage(el,border+quiet,border+quiet,size-(border+quiet)*2,size-(border+quiet)*2);let a=document.createElement('a');a.href=out.toDataURL('image/png');a.download='splitlah-paynow-'+(cur?.code||'qr')+'.png';a.click();toast('QR image saved')}
function markPaid(){if(!settleTarget)return;cur.settlements.push({...settleTarget,paidAt:new Date().toISOString()});push(cur);$('paidText').textContent=`${money(settleTarget.amount)} · ${memberName(settleTarget.from)} → ${memberName(settleTarget.to)}`;let total=cur.settlements.length+transfers().length;$('paidProgress').innerHTML=`<div class="card" style="text-align:left"><div class="k">Trip progress</div><div class="v">${cur.settlements.length} of ${total} settled</div><div class="bar"><div class="fill" style="width:${total?cur.settlements.length/total*100:100}%"></div></div></div>`;go('paid');if(cur)pushNav({view:'paid',code:cur.code,tab:'balances'})}
function tripUrl(memberId=''){return location.origin+location.pathname+'?join='+cur.code+(memberId?'&member='+encodeURIComponent(memberId):'')}
function shareTrip(){modal(`<h2>Share trip</h2><button class="btn receiptBtn" onclick="shareGroupInvite()">Share group invite</button><button class="btn ghost receiptBtn" onclick="openMemberInvite()">Invite specific person</button><button class="btn ghost receiptBtn" onclick="copyShare(tripUrl())">Copy invite link</button><button class="btn ghost receiptBtn" onclick="copyShare(cur.code)">Copy trip code</button>`)}
function openShare(){shareTrip()}
function shareGroupInvite(){shareNative(tripUrl(),'Join our SplitLah trip '+cur.name)}
function openMemberInvite(){let rows=memberList().map(([id,m])=>`<div class="expense row">${av(id)}<div class="grow"><b>${esc(m.name)}</b><div class="muted">Send a direct claim link</div></div><button class="btn ghost" onclick="shareMemberInvite('${esc(id)}')">Invite</button></div>`).join('');modal(`<h2>Invite specific person</h2><p class="muted">Use this when you already added someone and want their link to suggest that member.</p><div class="card">${rows}</div><button class="btn ghost" style="width:100%" onclick="shareTrip()">Back</button>`)}
function shareMemberInvite(id){let name=memberName(id),url=tripUrl(id);shareNative(url,'Join SplitLah as '+name+' for '+cur.name)}
async function shareNative(url,msg){if(navigator.share){try{await navigator.share({title:'SplitLah trip '+cur.code,text:msg,url});closeModal();return}catch(e){if(e.name==='AbortError')return}}copyShare(url)}
async function copyShare(url){try{await navigator.clipboard.writeText(url);toast('Invite copied')}catch(e){toast('Copy failed')}}
async function installApp(){if(!installPrompt)return;let p=installPrompt;installPrompt=null;await p.prompt();await p.userChoice.catch(()=>{});renderHome()}
function dismissInstall(){state.installDismissed=true;save();renderHome()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;state.installDismissed=false;save();if(!cur)renderHome()});
window.addEventListener('appinstalled',()=>{installPrompt=null;state.installDismissed=true;save();toast('SplitLah installed')});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}));
function modal(html){$('modalBody').innerHTML=html;$('modal').classList.add('on')} function closeModal(){$('modal').classList.remove('on')}
window.addEventListener('popstate',e=>{let s=e.state||{view:'home'};if($('modal').classList.contains('on'))closeModal();if(s.view==='home')return goHome(false);if(s.code){if(!state.trips[s.code])return goHome(false);openTrip(s.code,s.tab||'dashboard',false)}});
function setTheme(t){document.body.classList.toggle('light',t==='light');localStorage.setItem('sl_theme',t);const b1=$('btnDark'),b2=$('btnLight');if(b1)b1.classList.toggle('on',t==='dark');if(b2)b2.classList.toggle('on',t==='light')}function setFontSize(v){v=Math.max(12,Math.min(18,+v));document.documentElement.style.setProperty('--fs',v+'px');localStorage.setItem('sl_fs',v);const lbl=$('fsLabel');if(lbl)lbl.textContent=v+'px'}async function uploadReceipt(dataUrl){const key=state.imagekitKey,url=state.imagekitUrl;if(!key||!url)return dataUrl;try{const blob=await(await fetch(dataUrl)).blob();const fd=new FormData();const name='receipt_'+Date.now()+'.jpg';fd.append('file',blob,name);fd.append('fileName',name);fd.append('publicKey',key);const r=await fetch('https://upload.imagekit.io/api/v1/files/upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw Error(j.message||'Upload failed');return j.url}catch(e){console.warn('ImageKit:',e.message);return dataUrl}}function renderSpendChart(){const exps=cur.expenses||[];if(exps.length<2)return '';const byDay={};exps.forEach(e=>{const d=(e.at||'').slice(0,10)||'?';byDay[d]=(byDay[d]||0)+(+e.amount||0)});const days=Object.keys(byDay).sort();if(days.length<2)return '';const labels=days.map(d=>d.slice(5));const vals=days.map(d=>+byDay[d].toFixed(2));const id='sc'+Math.random().toString(36).slice(2,7);const light=document.body.classList.contains('light');const gc=light?'rgba(0,0,0,.07)':'rgba(255,255,255,.07)';const tc=light?'#6b6b65':'#b8b7af';setTimeout(()=>{const ctx=document.getElementById(id)?.getContext('2d');if(!ctx||!window.Chart)return;new Chart(ctx,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:'#1d9e75',borderRadius:5,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'S$'+c.parsed.y.toFixed(2)}}},scales:{y:{beginAtZero:true,grid:{color:gc},ticks:{color:tc,callback:v=>'S$'+v}},x:{grid:{display:false},ticks:{color:tc}}}}})},60);return `<div class="card"><div class="k">Daily spend</div><canvas id="${id}" height="90"></canvas></div>`}
renderHome();if(adminParam==='feedback')setTimeout(openAdminFeedback,100);else if(adminParam==='summary')setTimeout(openAdminSummary,100);else if(adminParam==='dashboard')setTimeout(openAdminDashboard,100);else if(joinParam)setTimeout(()=>openInvite(joinParam.toUpperCase(),memberParam||''),100);else if(!state.onboarded)setTimeout(()=>openSettings(true),100);
setInterval(()=>{if(cur&&!$('modal').classList.contains('on')&&!activeFormDirty())refreshTrip(true)},12000);
</script>
</body>
