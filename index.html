<body>
<main class="app">
  <section id="home" class="view on">
    <div class="homeHead">
      <div class="brand">SPLITLAH <span class="vTag"></span></div>
      <div class="row"><div class="h1 grow" id="hello">Hi there</div><button class="navChip" onclick="openSettings()">EDIT PROFILE</button></div>
      </div>
    <div class="body" id="tripList"></div><button class="fabNewTrip" id="fabNewTrip" onclick="openNewTrip()">NEW TRIP</button>
  </section>
  <section id="trip" class="view">
    <header class="head">
     <div class="brand">SPLITLAH <span class="vTag"></span></div>
      <div class="top"><div><div class="row titleRow"><div class="h1 grow" id="tripName">Trip</div></div><div class="sub tripMeta" id="tripMeta"></div></div><div class="share"><div class="k">Your share</div><b id="yourShare">S$0</b></div></div>
      <div class="stats"><div class="stat"><div class="k">Total</div><div class="v" id="statTotal">S$0</div></div><div class="stat"><div class="k">Avg/person</div><div class="v" id="statPax">S$0</div></div></div>
      <nav class="tabs"><button class="tab" id="tab-dashboard" onclick="setTab('dashboard')">Dashboard</button><button class="tab" id="tab-expenses" onclick="setTab('expenses')">Expenses</button><button class="tab" id="tab-balances" onclick="setTab('balances')">Settle</button><button class="tab" id="tab-members" onclick="setTab('members')">Members</button></nav>
    </header>
    <div class="body">
      <div id="tabBody"></div>
      <button class="fabExpense" onclick="openExpenseForm()">ADD EXPENSE</button><button class="backChip" onclick="goHome()">← TRIPS</button>
    </div>
  </section>
  <section id="settle" class="view">
    <div class="head" style="padding-bottom:26px"><button class="btn ghost" onclick="openTrip(cur.code,'balances')">Back</button><div class="h1">Settle up</div><div class="row" style="margin-top:16px"><div class="av" id="payFromAv"></div><div class="grow"><div class="sub" id="payFromName">Payer owes</div><div class="h1" id="payAmt">S$0</div><div class="sub" id="payToName" style="text-align:right">to payee</div></div><div class="av" id="payToAv"></div></div></div>
    <div class="body"><div class="card" id="payCard"></div><button class="btn" id="markPaidBtn" style="width:100%" onclick="markPaid()">I have paid</button></div>
  </section>
  <section id="paid" class="view">
    <div class="head" style="padding-bottom:18px"><button class="btn ghost" onclick="openTrip(cur.code,'balances')">Back</button><div class="h1">Settle up</div></div>
    <div class="body" style="text-align:center"><div class="check">✓</div><div class="screenTitle">Payment recorded</div><div class="muted" id="paidText" style="margin:8px 0 24px"></div><div id="paidProgress"></div><button class="btn ghost" style="width:100%" onclick="openTrip(cur.code,'dashboard')">Back to trip</button></div>
  </section>
</main>
<button class="feedbackFab" onclick="openFeedback()">BETA FEEDBACK</button>

<script>
(function(){const th=localStorage.getItem('sl_theme');const fs=localStorage.getItem('sl_fs');if(th==='light')document.body.classList.add('light');if(fs)document.documentElement.style.setProperty('--fs',fs+'px')})();
const API_DEFAULT='https://splitlah-api.ncheewee.workers.dev',LS='sl_codex_v1',APP_VERSION=52;
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.vTag').forEach(el=>el.textContent=' · Claude v'+APP_VERSION)});
const CATS=['🍜 Food','🏨 Stay','🚌 Transport','🎡 Activities','🛍 Shopping','🌃 Nightlife','💊 Health','★ Other'];
let dashChart='flow',expCat=7;
const colors=['#0ea371','#2f6fed','#f08a24','#d94f8f','#7c5cff','#00a6b8','#c94a38','#6f8f22'];
let params=new URLSearchParams(location.search),state=JSON.parse(localStorage.getItem(LS)||'{}'),cur=null,tab='dashboard',settleTarget=null,pendingJoin=null,joinParam=params.get('join'),memberParam=params.get('member'),adminParam=params.get('admin'),restoreParam=params.get('restore'),installPrompt=null,pendingReceiptUrl=null,pendingEditReceiptUrl=null,pendingSettleReceiptUrl=null;
if(!state.uid)state.uid='u_'+crypto.randomUUID(); if(state.name==null)state.name=''; if(state.onboarded==null)state.onboarded=!!state.name; if(!state.api)state.api=API_DEFAULT; if(!state.trips)state.trips={}; if(!state.claims)state.claims={}; if(!state.pendingInvite)state.pendingInvite=null; if(state.paynowProxy==null)state.paynowProxy=''; if(!state.whoPaidMode)state.whoPaidMode='callout';if(state.showArchived==null)state.showArchived=false; if(!state.imagekitKey)state.imagekitKey=''; if(!state.imagekitUrl)state.imagekitUrl=''; migrateState(); Object.keys(state.trips).forEach(c=>state.trips[c]=normalizeTrip(state.trips[c])); save();
history.replaceState({view:'home'},'');
function $(id){return document.getElementById(id)} function save(){localStorage.setItem(LS,JSON.stringify(state))} function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return crypto.randomUUID()} function code(){return Math.random().toString(36).replace(/[^a-z0-9]/gi,'').slice(2,8).toUpperCase()} function money(n){return 'S$'+(Math.round(n*100)/100).toLocaleString('en-SG',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function initials(n){return (n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()} function memberList(t=cur){return Object.entries(t.members||{})} function memberName(id){return cur?.members?.[id]?.name||'Unknown'} function av(id){let m=cur?.members?.[id]||{};return `<div class="av" style="background:${m.avatarColor||colors[0]}">${esc(initials(m.name))}</div>`}
async function api(path,method='GET',body){let r=await fetch(state.api+path,{method,headers:{'Content-Type':'application/json'},body:body&&JSON.stringify(body)});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'API error');return j}
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
function whenModalClosed(cb,timeout=8000){let start=Date.now();(function check(){let m=$('modal');if(!m||!m.classList.contains('on'))return cb();if(Date.now()-start>timeout)return cb();setTimeout(check,400)})()}
async function offerInstallRestore(code,memberId){if(isStandalone())return;try{let r=await api('/restore','POST',{uid:state.uid,name:state.name,paynowProxy:state.paynowProxy,claims:state.claims}),link=location.origin+location.pathname+'?restore='+r.token,pretty=(r.token.match(/.{1,5}/g)||[r.token]).join('-'),n=r.tripCount||Object.keys(state.claims||{}).length;whenModalClosed(()=>modal(`<h2>You're linked as ${esc(state.name||'you')}</h2><p class="muted">Add SplitLah to your Home Screen for the full app feel. If you do, this device's storage starts empty — use this code to bring your identity (and all ${n} of your trip${n===1?'':'s'}) along.</p><div class="card" style="text-align:center"><div class="k">Restore code</div><div style="font-size:1.35rem;font-weight:900;letter-spacing:.07em;margin:8px 0">${esc(pretty)}</div><button class="btn ghost mini" onclick="copyShare('${esc(link)}')">Copy restore link</button></div><p class="muted" style="font-size:.78rem">On iPhone: tap Share → <b>Add to Home Screen</b>. Open the new app icon, then paste the link or enter the code under <b>Already joined a trip?</b> on the home screen.</p><button class="btn" style="width:100%" onclick="closeModal()">Got it</button>`,true),1200)}catch(e){}}
async function applyRestoreToken(token){token=String(token||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(!token)return;try{let r=await api('/restore/'+encodeURIComponent(token)),claims=r.claims||{},codes=Object.keys(claims);if(!codes.length)throw Error('No trips found in this restore code');let restored=0,lastCode=null;for(const code of codes){let memberId=claims[code],trip=null;try{trip=await pull(code)}catch(e){if(state.trips[code])trip=normalizeTrip(state.trips[code])}if(trip&&trip.members[memberId]){state.trips[code]=trip;state.claims[code]=memberId;restored++;lastCode=code}}if(!restored)throw Error('Trip or member not found');if(!state.name||state.name==='there')state.name=r.name||state.name;if(!state.paynowProxy&&r.paynowProxy)state.paynowProxy=normalizePayNowProxy(r.paynowProxy);state.onboarded=true;save();toast('Restored '+restored+' trip'+(restored===1?'':'s')+' as '+(state.name||'you'));closeModal();if(restored===1)openTrip(lastCode);else goHome()}catch(e){toast('Restore failed: '+e.message)}}
function openRestoreEntry(){modal(`<h2>Restore your identity</h2><p class="muted">Already joined a trip on another browser or device? Enter the restore code you were given, or paste the restore link.</p><input class="field" id="restoreCodeInput" placeholder="e.g. ABCDE-FGHIJ or paste link"><div style="height:10px"></div><button class="btn" style="width:100%" onclick="submitRestoreCode()">Restore</button>`,true)}
function submitRestoreCode(){let v=($('restoreCodeInput')?.value||'').trim();let m=v.match(/[?&]restore=([A-Za-z0-9]+)/);if(m)v=m[1];v=v.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!v)return toast('Enter a code or link');closeModal();applyRestoreToken(v)}
async function showMyRestoreCode(){let codes=Object.keys(state.claims||{}).filter(c=>state.trips[c]&&!state.trips[c].deletedAt);if(!codes.length)return toast('Join a trip first to get a restore code');closeModal();toast('Generating restore code…');try{let r=await api('/restore','POST',{uid:state.uid,name:state.name,paynowProxy:state.paynowProxy,claims:state.claims}),link=location.origin+location.pathname+'?restore='+r.token,pretty=(r.token.match(/.{1,5}/g)||[r.token]).join('-'),n=r.tripCount||codes.length;modal(`<h2>Your restore code</h2><p class="muted">Use this on another browser or device to bring your identity — name, PayNow, and all ${n} of your trip${n===1?'':'s'} — back in one go. One-time use, expires in 7 days.</p><div class="card" style="text-align:center"><div class="k">Restore code</div><div style="font-size:1.35rem;font-weight:900;letter-spacing:.07em;margin:8px 0">${esc(pretty)}</div><button class="btn ghost mini" onclick="copyShare('${esc(link)}')">Copy restore link</button></div><button class="btn" style="width:100%;margin-top:12px" onclick="closeModal()">Done</button>`,true)}catch(e){toast('Could not generate code: '+e.message)}}
function normalizePayNowProxy(v){v=String(v||'').trim().replace(/\s+/g,'');if(/^\d{8}$/.test(v))return '+65'+v;if(/^65\d{8}$/.test(v))return '+'+v;return v}
function normalizeTrip(t){t=t||{};t.members=t.members||{};t.expenses=t.expenses||[];t.settlements=t.settlements||[];t.currency=t.currency||'SGD';let i=0;Object.entries(t.members).forEach(([id,m])=>{t.members[id]=typeof m==='string'?{name:m,avatarColor:colors[i%colors.length],paynowProxy:''}:{name:m.name||'Unknown',avatarColor:colors[i%colors.length],paynowProxy:normalizePayNowProxy(m.paynowProxy||'')};i++});if(!t.ownerId)t.ownerId=Object.keys(t.members)[0]||'';if(!t.status)t.status='active';t.expenses.forEach(e=>{e.originalAmount=e.originalAmount??e.amount;e.currency=e.currency||'SGD';e.fxRate=e.fxRate||1;e.splits=e.splits||null});return t}
function migrateState(){let v=+(state.appVersion||0);if(v<14){['TOKYX','DKM8T1','QL6MKH','5B2OYE','S3CMY5','24UUP3','R4EWGL'].forEach(c=>delete state.trips[c]);Object.keys(state.trips).forEach(c=>{let t=state.trips[c];if(t?.name&&/^(Codex|Cycle|Fresh Beta|Beta Share|Tokyo Trip)/i.test(t.name))delete state.trips[c]})}state.appVersion=APP_VERSION}
async function push(t){t=normalizeTrip(t);t.updated_at=new Date().toISOString();state.trips[t.code]=t;save();try{let j=await api('/trips/'+t.code,'PUT',t);state.trips[t.code]=normalizeTrip(j.trip);if(cur&&cur.code===t.code)cur=state.trips[t.code];save();toast('Saved')}catch(e){toast('Local only: '+e.message)}}
async function pull(c){let j=await api('/trips/'+c),t=normalizeTrip(j.trip);if(t.deletedAt)throw Error('Trip was deleted');state.trips[c]=t;save();return state.trips[c]}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));scrollTo(0,0)}
function pushNav(s){if(history.state&&JSON.stringify(history.state)===JSON.stringify(s))return;history.pushState(s,'')}
function goHome(hist=true){cur=null;go('home');renderHome();if(hist)pushNav({view:'home'})}
function me(t=cur){return (t&&state.claims?.[t.code])||state.uid}
function visibleTrips(){return Object.values(state.trips).filter(t=>!t.deletedAt&&t.members&&t.members[me(t)])}
function tripStatus(t){return t.status||'active'}
function isClosed(t){let s=tripStatus(t||cur);return s==='closed'||s==='archived'}
function toggleShowArchived(){state.showArchived=!state.showArchived;save();renderHome()}
function isOwner(t=cur){return t&&t.ownerId===me(t)}
function ownerName(t=cur){return t?.members?.[t.ownerId]?.name||'trip owner'}
function tripCard(t,muted=false){let total=tripTotal(t),ms=memberList(t),st=tripStatus(t);let pill=st==='closed'?'<span class="closedPill">Closed</span>':st==='archived'?'<span class="archivedPill">Archived</span>':isOwner(t)?'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px"><span class="owner">Owner</span><button class="editChip" style="white-space:nowrap" onclick="event.stopPropagation();editTripCard(\''+t.code+'\')">EDIT TRIP</button></div>':'';return `<div class="card trip${muted?' tripClosed':''}" onclick="openTrip('${t.code}')"><div class="row"><div class="grow"><div class="screenTitle">${esc(t.name)}</div><div class="muted">${ms.length} members · ${(t.expenses||[]).length} expenses</div><div class="ownerLine">Started by ${esc(ownerName(t))}</div></div>${pill}</div><div class="row" style="margin-top:16px"><div class="avatars">${ms.slice(0,5).map(([id,m])=>`<div class="av" style="background:${m.avatarColor}">${esc(initials(m.name))}</div>`).join('')}</div><div class="grow"></div><div class="amount">${money(total)}</div></div><div class="row" style="margin-top:10px;gap:6px;border-top:1px solid var(--line);padding-top:10px"><button class="navChip" style="font-size:.62rem" onclick="event.stopPropagation();shareTripCard('${t.code}')">SHARE</button>${isOwner(t)?`<button class="navChip" style="font-size:.62rem" onclick="event.stopPropagation();manageTripCard('${t.code}')">MANAGE</button>`:''}</div></div>`}
function shareTripCard(code){cur=normalizeTrip(state.trips[code]);shareTrip();}function editTripCard(code){cur=normalizeTrip(state.trips[code]);openTripEdit();}function manageTripCard(code){cur=normalizeTrip(state.trips[code]);openTripManage();}function renderHome(){ $('hello').textContent='Hi, '+(state.name||'there'); let all=visibleTrips(),install=installPrompt&&!state.installDismissed?`<div class="card"><div class="row"><div class="grow"><div class="screenTitle">Install SplitLah</div><div class="muted">Add it to your home screen for a native app feel.</div></div><button class="btn" onclick="installApp()">Install</button><button class="btn ghost mini" onclick="dismissInstall()">Later</button></div></div>`:'';let active=all.filter(t=>tripStatus(t)==='active'),closed=all.filter(t=>tripStatus(t)==='closed'),archived=all.filter(t=>tripStatus(t)==='archived');let out=install;if(!all.length){out+='<div class="card muted">No trips yet. Create a trip to get started.</div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="openRestoreEntry()">Already joined a trip? Restore with code</button>'}else{out+=active.map(t=>tripCard(t,false)).join('');out+=closed.map(t=>tripCard(t,true)).join('');if(archived.length){out+=`<button class="archivedToggle" onclick="toggleShowArchived()">${state.showArchived?'▾':'▸'} Archived (${archived.length})</button>`;if(state.showArchived)out+=archived.map(t=>tripCard(t,true)).join('')}}$('tripList').innerHTML=out}
function openNewTrip(){modal(`<h2>New trip</h2><input class="field" id="ntName" placeholder="Weekend trip"><div style="height:10px"></div>${selectWrap('ntCur',ccyOptions(),'',true)}<div style="height:10px"></div><button class="btn" style="width:100%" onclick="createTrip()">Create trip</button>`);setTimeout(()=>{const s=document.querySelector('#modal .sheet');if(s)s.style.overflow='visible';},15);}
function createTrip(){let name=$('ntName').value.trim();if(!name)return toast('Trip name needed');if(!state.name)return openSettings(true);let c=code(),id=state.uid;let t={id:uid(),code:c,name,currency:$('ntCur').value.trim().toUpperCase()||'SGD',ownerId:id,members:{[id]:{name:state.name,avatarColor:colors[0],paynowProxy:normalizePayNowProxy(state.paynowProxy)}},expenses:[],settlements:[],updated_at:new Date().toISOString()};closeModal();push(t);openTrip(c,'members');setTimeout(promptAddFirstMember,400)}
function promptAddFirstMember(){if(!cur||!isOwner()||memberList().length>1)return;modal('<div style="text-align:center;padding:8px 0"><div style="font-size:2rem;margin-bottom:10px">👥</div><h2 style="margin:0 0 8px">Add your travel mates</h2><p style="color:var(--muted);margin:0 0 16px;font-size:.9rem">Add everyone splitting expenses on this trip. You can find the add form in the Members tab below.</p><button class="btn" style="width:100%;margin-bottom:8px" onclick="closeModal()">Got it, let\'s add them</button></div>',true);}
function openJoin(prefill=''){modal(`<h2>Join code</h2><input class="field" id="joinCode" placeholder="ABC123" maxlength="6" value="${esc(prefill)}"><div style="height:10px"></div><button class="btn" style="width:100%" onclick="joinTrip()">Join</button>`)}
async function joinTrip(){let c=$('joinCode').value.trim().toUpperCase();if(!c)return;openInvite(c)}
async function openInvite(c,mid=''){let code=String(c||'').toUpperCase();if(!code)return;state.pendingInvite={code,memberId:mid||'',at:Date.now()};save();try{let t=await pull(code);if(t.members[me(t)]){state.pendingInvite=null;save();closeModal();openTrip(t.code);return}pendingJoin=t;showJoinChoice(t,mid)}catch(e){if(/deleted|not found|Trip not found/i.test(e.message)){state.pendingInvite=null;save()}toast(e.message)}}
function showJoinChoice(t,mid=''){let suggested=mid&&t.members[mid]?`<div class="card"><div class="k">Suggested</div><div class="expense row">${avFrom(t.members[mid])}<div class="grow"><b>${esc(t.members[mid].name)}</b><div class="muted">Pre-selected from invite link</div></div><button class="btn" onclick="claimJoin('${esc(mid)}')">Continue</button></div></div>`:'',rows=memberList(t).map(([id,m])=>`<div class="expense row">${avFrom(m)}<div class="grow"><b>${esc(m.name)}</b><div class="muted">${m.paynowProxy?'PayNow set':'Member'}</div></div><button class="btn ghost" onclick="claimJoin('${esc(id)}')">This is me</button></div>`).join('');modal(`<h2>${esc(t.name)}</h2><p class="muted">Who are you? Pick yourself if you are already listed, or join as a new member.</p><div class="card"><div class="muted">Started by ${esc(ownerName(t))} · ${memberList(t).length} members</div></div>${suggested}<div class="card">${rows}</div><button class="btn" style="width:100%" onclick="joinAsNew()">I'm not listed</button>`)}
function avFrom(m){return `<div class="av" style="background:${m.avatarColor||colors[0]}">${esc(initials(m.name))}</div>`}
function claimJoin(id){if(!pendingJoin||!pendingJoin.members[id])return;let m=pendingJoin.members[id],code=pendingJoin.code;state.claims[code]=id;state.trips[code]=normalizeTrip(pendingJoin);state.pendingInvite=null;if(!state.name||state.name==='there'||state.name!==m.name)state.name=m.name||state.name;if(!state.paynowProxy&&m.paynowProxy)state.paynowProxy=m.paynowProxy;state.onboarded=true;save();closeModal();openTrip(code);setTimeout(()=>{if(!normalizePayNowProxy(m.paynowProxy||state.paynowProxy))openSettings(false)},250);setTimeout(()=>offerInstallRestore(code,id),900);toast('Joined as '+m.name)}
function joinAsNew(){if(!pendingJoin)return;modal(`<h2>Join ${esc(pendingJoin.name)}</h2><label class="muted">Your name</label><input class="field" id="joinName" value="${esc(state.name||'')}" placeholder="Your name"><div style="height:10px"></div><label class="muted">PayNow proxy</label><input class="field" id="joinPayNow" value="${esc(state.paynowProxy||'')}" placeholder="+65 mobile or NRIC"><div style="height:10px"></div><button class="btn" style="width:100%" onclick="confirmJoinAsNew()">Join trip</button>`)}
async function confirmJoinAsNew(){let t=pendingJoin;if(!t)return;let n=($('joinName')?.value||state.name||'').trim();if(!n)return toast('Name needed');state.name=n;state.paynowProxy=normalizePayNowProxy($('joinPayNow')?.value||state.paynowProxy||'');state.onboarded=true;t.members[state.uid]={name:state.name,avatarColor:colors[memberList(t).length%colors.length],paynowProxy:state.paynowProxy};state.claims[t.code]=state.uid;state.trips[t.code]=normalizeTrip(t);state.pendingInvite=null;save();await push(t);closeModal();openTrip(t.code);setTimeout(()=>offerInstallRestore(t.code,state.uid),900)}
function openSettings(first=false){modal(`<div style='padding:4px 0 16px'><div style='font-size:1.1rem;font-weight:700;margin-bottom:20px'>${first?'Set up profile':'Edit profile'}</div><label class='muted' style='display:block;margin-bottom:6px;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em'>Your name</label><input class='field' id='setName' value='${esc(state.name)}' placeholder='Your name' style='margin-bottom:14px'><label class='muted' style='display:block;margin-bottom:6px;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em'>PayNow number</label><input class='field' id='setPayNow' inputmode='tel' value='${esc(state.paynowProxy||"")}' placeholder='+65 mobile or NRIC'><p class='muted' style='font-size:.73rem;margin:7px 0 22px;opacity:.6'>Used when members request payment from you.</p><button class='btn' style='width:100%' onclick='saveSettings()'>Save</button><button class='btn ghost' style='width:100%;margin-top:10px' onclick='closeModal();openRestoreEntry()'>Restore identity from another device</button>${Object.keys(state.claims||{}).length?`<button class='btn ghost' style='width:100%;margin-top:10px' onclick='closeModal();showMyRestoreCode()'>Get my restore code</button>`:''}</div>`)}
async function saveSettings(){let nextName=$('setName').value.trim();if(!nextName)return toast('Name needed');state.name=nextName;state.paynowProxy=normalizePayNowProxy($('setPayNow').value);state.onboarded=true;let touched=[];Object.values(state.trips).forEach(t=>{t=normalizeTrip(t);let id=state.claims?.[t.code]||state.uid;if(!t.deletedAt&&t.members[id]){t.members[id].name=state.name;t.members[id].paynowProxy=state.paynowProxy;touched.push(t)}});if(cur){let id=me(cur);if(cur.members?.[id]){cur.members[id].name=state.name;cur.members[id].paynowProxy=state.paynowProxy}}save();closeModal();cur?renderTrip():renderHome();toast(touched.length?'Profile updated in trips':'Profile saved');if(joinParam&&!cur)setTimeout(()=>openInvite(joinParam.toUpperCase(),memberParam||''),150);for(const t of touched)await push(t)}
function openFeedback(){modal(`<h2>Send feedback</h2><textarea class="field" id="fbMsg" rows="6" placeholder="Bug, confusing bit, or suggestion..."></textarea><div style="height:10px"></div><button class="btn" style="width:100%" onclick="submitFeedback()">Send feedback</button>`)}
async function submitFeedback(){let message=$('fbMsg').value.trim();if(!message)return toast('Feedback needed');try{await api('/feedback','POST',{message,rating:3,tripCode:cur?.code||'',screen:cur?tab:'home',appVersion:'v'+APP_VERSION,actorName:state.name,actorId:state.uid});closeModal();toast('Feedback sent')}catch(e){toast('Feedback failed: '+e.message)}}
async function adminFeedbackData(){try{return await api('/admin/feedback')}catch(e){let j=await api('/trips/FDBACK'),items=(j.trip?.feedback||[]).map(f=>({...f,tripCode:f.tripCode||'FDBACK'}));return {feedback:items,fallback:true}}}
async function adminSummaryData(){try{return await api('/admin/summary')}catch(e){return {totals:{trips:0,expenses:0,members:0,totalSgd:0},trips:[],fallback:true,error:e.message}}}

function renderWhoPaid(paidBy,total){

  exps.forEach(e=>{const cat=e.cat||CATS[7];if(!catMap[e.paidBy])catMap[e.paidBy]={};catMap[e.paidBy][cat]=(catMap[e.paidBy][cat]||0)+e.amount;});
  const tot=tripTotal()||1;
  const stripCat=c=>String(c).replace(/^\S+\s+/,'');
  const fmtPct=v=>{const p=v/tot*100;return (p>=10?Math.round(p):p.toFixed(1))+'%';};
  const W=300,H=240,LW=10,mX=20,cX=W-20,GAP=10;
  const mNodes=ml.map(([id,m])=>{const t=Object.values(catMap[id]||{}).reduce((s,v)=>s+v,0);return{id,m,t};}).filter(n=>n.t>0);
  const catTots={};
  CATS.forEach(c=>{catTots[c]=exps.filter(e=>(e.cat||CATS[7])===c).reduce((s,e)=>s+e.amount,0);});
  const cNodes=CATS.filter(c=>catTots[c]>0).map(c=>({c,t:catTots[c]}));
  function layout(nodes,h){let used=h-GAP*(nodes.length-1),y=0;return nodes.map(n=>{const nh=Math.max(72,used*n.t/tot);const out={...n,y,h:nh};y+=nh+GAP;return out;});}
  const mL=layout(mNodes,H),cL=layout(cNodes,H);
  const mOff={},cOff={};
  mL.forEach(n=>mOff[n.id]=0);cL.forEach(n=>cOff[n.c]=0);
  const paths=[];
  mL.forEach(mn=>{
    CATS.forEach(cat=>{
      const v=(catMap[mn.id]||{})[cat]||0;if(v<=0)return;
      const cn=cL.find(n=>n.c===cat);if(!cn)return;
      const mh=mn.h*v/mn.t,ch=cn.h*v/cn.t;
      const my1=mn.y+mOff[mn.id],my2=my1+mh;
      const cy1=cn.y+cOff[cn.c],cy2=cy1+ch;
      const cpx=(mX+LW+cX)/2;
      paths.push(`<path d="M${(mX+LW).toFixed(1)} ${my1.toFixed(1)} C${cpx} ${my1.toFixed(1)} ${cpx} ${cy1.toFixed(1)} ${cX} ${cy1.toFixed(1)} L${cX} ${cy2.toFixed(1)} C${cpx} ${cy2.toFixed(1)} ${cpx} ${my2.toFixed(1)} ${(mX+LW).toFixed(1)} ${my2.toFixed(1)}Z" fill="${mn.m.avatarColor}" opacity=".38"/>`);
      mOff[mn.id]+=mh;cOff[cn.c]+=ch;
    });
  });
  const uid='sk'+Math.random().toString(36).slice(2,7);
  const mB=mL.map(n=>{
    const cy=n.y+n.h/2;
    return `<rect x="${mX}" y="${n.y.toFixed(1)}" width="${LW}" height="${n.h.toFixed(1)}" rx="3" fill="${n.m.avatarColor}"/>`+
      `<text x="${(mX-6).toFixed(1)}" y="${(cy-22).toFixed(1)}" text-anchor="end" fill="rgba(255,255,255,.97)" font-size="26" font-weight="700" font-family="system-ui">${esc(n.m.name)}</text>`+
      `<text x="${(mX-6).toFixed(1)}" y="${(cy+4).toFixed(1)}" text-anchor="end" fill="rgba(255,255,255,.82)" font-size="19" font-weight="700" font-family="system-ui">${esc(money(n.t))}</text>`+
      `<text x="${(mX-6).toFixed(1)}" y="${(cy+23).toFixed(1)}" text-anchor="end" fill="rgba(255,255,255,.55)" font-size="19" font-weight="600" font-family="system-ui">${fmtPct(n.t)}</text>`;
  }).join('');
  const cB=cL.map(n=>{
    const cy=n.y+n.h/2;
    return `<rect x="${cX}" y="${n.y.toFixed(1)}" width="${LW}" height="${n.h.toFixed(1)}" rx="3" fill="rgba(255,255,255,.2)"/>`+
      `<text x="${(cX+LW+6).toFixed(1)}" y="${(cy-22).toFixed(1)}" fill="rgba(255,255,255,.97)" font-size="26" font-weight="700" font-family="system-ui">${esc(stripCat(n.c))}</text>`+
      `<text x="${(cX+LW+6).toFixed(1)}" y="${(cy+4).toFixed(1)}" fill="rgba(255,255,255,.82)" font-size="19" font-weight="700" font-family="system-ui">${esc(money(n.t))}</text>`+
      `<text x="${(cX+LW+6).toFixed(1)}" y="${(cy+23).toFixed(1)}" fill="rgba(255,255,255,.55)" font-size="19" font-weight="600" font-family="system-ui">${fmtPct(n.t)}</text>`;
  }).join('');
  const wipeDef=`<defs><clipPath id="${uid}"><rect x="-30" y="-10" width="0" height="${H+20}"><animate attributeName="width" from="0" to="${W+60}" dur="0.7s" begin="0.05s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/></rect></clipPath></defs>`;
  const totX=W/2,totY=H/2;const totBox=`<rect x="${(totX-72).toFixed(0)}" y="${(totY-30).toFixed(0)}" width="144" height="60" rx="12" fill="rgba(0,0,0,.58)" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="${totX}" y="${(totY-9).toFixed(0)}" text-anchor="middle" fill="rgba(255,255,255,.58)" font-size="13" font-weight="700" letter-spacing="1.5" font-family="system-ui">TOTAL</text><text x="${totX}" y="${(totY+17).toFixed(0)}" text-anchor="middle" fill="rgba(255,255,255,.97)" font-size="25" font-weight="800" font-family="system-ui">${esc(money(tot))}</text>`;
  return `<div style="overflow:hidden"><svg viewBox="-140 -8 ${W+280} ${H+28}" style="width:100%;display:block" preserveAspectRatio="xMidYMid meet">${wipeDef}<g clip-path="url(#${uid})">${paths.join('')}</g>${mB}${cB}${totBox}</svg></div>`;
}

function renderChartSection(){
  const tabs=[['flow','FLOW'],['donut','RING'],['daily','BARS']];
  const paidBy={};memberList().forEach(([id])=>paidBy[id]=0);
  (cur.expenses||[]).forEach(e=>paidBy[e.paidBy]=(paidBy[e.paidBy]||0)+e.amount);
  const content=dashChart==='flow'?renderSankey():dashChart==='donut'?renderWhoPaid(paidBy,tripTotal()):renderSpendChart();
  const tog=`<div style="display:flex;gap:0;margin-bottom:14px;background:rgba(255,255,255,.06);border-radius:10px;padding:3px">${tabs.map(([k,l])=>`<button onclick="dashChart='${k}';const a=document.getElementById('dashChartArea');if(a)a.innerHTML=renderChartSection()" style="flex:1;padding:7px 4px;border:0;border-radius:8px;font-size:.72rem;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:all .2s;background:${dashChart===k?'var(--accent)':'transparent'};color:${dashChart===k?'#fff':'var(--muted)'}">${l}</button>`).join('')}</div>`;
  return tog+content;
}
function renderDashboard(){
  const b=balances(),max=Math.max(...Object.values(b).map(Math.abs),1);
  return `<div class="card" id="dashChartArea">${renderChartSection()}</div><div class="card"><div class="k">Net balance</div><div class="dashList">${memberList().map(([id,m])=>`<div class="balanceRow"><div class="row"><div class="grow">${esc(m.name)}</div><b class="${(b[id]||0)>=0?'good':'badTxt'}">${(b[id]||0)>=0?'+':'-'}${money(Math.abs(b[id]||0))}</b></div><div class="bar"><div class="fill" style="width:${Math.abs(b[id]||0)/max*100}%;background:${(b[id]||0)>=0?'var(--accent)':'var(--bad)'}"></div></div></div>`).join('')}</div></div>`;
}

function tlv(id,v){v=String(v);return id+String(v.length).padStart(2,'0')+v}
function crc16(raw){let crc=0xFFFF;for(let i=0;i<raw.length;i++){crc^=raw.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1)}return crc&0xFFFF}
function buildPayNowQR(proxy,amount,name){proxy=normalizePayNowProxy(proxy);let type=proxy.startsWith('+65')?'0':'2',mai=tlv('00','SG.PAYNOW')+tlv('01',type)+tlv('02',proxy)+tlv('03','0');let raw=[tlv('00','01'),tlv('01','12'),tlv('26',mai),tlv('52','0000'),tlv('53','702'),tlv('54',(+amount).toFixed(2)),tlv('58','SG'),tlv('59',(name||'PAYNOW').slice(0,25)),tlv('60','Singapore'),'6304'].join('');return raw+crc16(raw).toString(16).toUpperCase().padStart(4,'0')}
function openSettle(i,hist=true){pendingSettleReceiptUrl=null;settleTarget=transfers()[i];$('payFromAv').outerHTML=av(settleTarget.from).replace('class="av"','class="av" id="payFromAv"');$('payToAv').outerHTML=av(settleTarget.to).replace('class="av"','class="av" id="payToAv"');$('payFromName').textContent=memberName(settleTarget.from)+' pays';$('payToName').textContent='to '+memberName(settleTarget.to);$('payAmt').textContent=money(settleTarget.amount);let payee=cur.members[settleTarget.to],payBlock=payee.paynowProxy?`<div class="qrHint"><div class="qrFrame"><div id="qr" class="qr" onclick="saveQrImage()"></div></div></div><button class="btn ghost" style="width:100%" onclick="saveQrImage()">Save QR image</button><div style="text-align:center;margin-top:10px" class="muted">Scan with PayNow<br><b class="good">${esc(normalizePayNowProxy(payee.paynowProxy))}</b><br>${esc(money(settleTarget.amount))}</div>`:`<p class="muted">${esc(memberName(settleTarget.to))} has no PayNow proxy yet. Transfer manually, then record it below.</p>`;$('payCard').innerHTML=`<div class="k">Step 1 · Pay ${esc(memberName(settleTarget.to))}</div>${payBlock}<div class="fxbox"><div class="k">Step 2 · Attach payment proof</div><div class="muted" style="margin:6px 0 10px">Optional, but useful for trip receipts and review.</div><div class="grid2"><button type="button" class="btn ghost" onclick="document.getElementById('settleReceiptCamera').click()">Take photo</button><button type="button" class="btn ghost" onclick="document.getElementById('settleReceiptGallery').click()">Gallery</button></div><div id="settleReceiptPreview"></div></div><div class="fxbox"><div class="k">Step 3 · Record payment</div><div class="muted" style="margin-top:6px">Only tap once the transfer is done. This removes it from outstanding balances for everyone.</div></div>`;let btn=$('markPaidBtn');if(btn)btn.textContent='I have paid';go('settle');if(hist&&cur)pushNav({view:'settle',code:cur.code,tab:'balances'});setTimeout(()=>{if(payee.paynowProxy&&window.QRCode){new QRCode($('qr'),{text:buildPayNowQR(payee.paynowProxy,settleTarget.amount,memberName(settleTarget.to)),width:320,height:320})}},50)}
function saveQrImage(){let el=$('qr')?.querySelector('canvas,img');if(!el)return toast('QR not ready');let out=document.createElement('canvas'),size=1024,border=72,quiet=96;out.width=size;out.height=size;let ctx=out.getContext('2d');ctx.fillStyle='#1d9e75';ctx.fillRect(0,0,size,size);ctx.fillStyle='#fff';ctx.fillRect(border,border,size-border*2,size-border*2);ctx.drawImage(el,border+quiet,border+quiet,size-(border+quiet)*2,size-(border+quiet)*2);let a=document.createElement('a');a.href=out.toDataURL('image/png');a.download='splitlah-paynow-'+(cur?.code||'qr')+'.png';a.click();toast('QR image saved')}
function markPaid(){if(!settleTarget)return;let proof=pendingSettleReceiptUrl||'';cur.settlements.push({...settleTarget,paidAt:new Date().toISOString(),receiptUrl:proof});pendingSettleReceiptUrl=null;push(cur);$('paidText').textContent=`${money(settleTarget.amount)} · ${memberName(settleTarget.from)} → ${memberName(settleTarget.to)}`;let total=cur.settlements.length+transfers().length,proofHtml=proof?`<div class="fxbox row" style="justify-content:center"><img class="thumb" src="${proof}"><div style="text-align:left"><b>Payment proof saved</b><div class="muted" style="font-size:.75rem">Attached to this settlement</div></div></div>`:'';$('paidProgress').innerHTML=`${proofHtml}<div class="card" style="text-align:left"><div class="k">Trip progress</div><div class="v">${cur.settlements.length} of ${total} settled</div><div class="bar"><div class="fill" style="width:${total?cur.settlements.length/total*100:100}%"></div></div></div>`;go('paid');if(cur)pushNav({view:'paid',code:cur.code,tab:'balances'})}
function tripUrl(memberId=''){return location.origin+location.pathname+'?join='+cur.code+(memberId?'&member='+encodeURIComponent(memberId):'')}
function shareTrip(){modal(`<h2>Share trip</h2><button class="btn receiptBtn" onclick="shareGroupInvite()">Share group invite</button><button class="btn ghost receiptBtn" onclick="openMemberInvite()">Invite specific person</button><button class="btn ghost receiptBtn" onclick="copyShare(tripUrl())">Copy invite link</button>${isOwner()?'<p class="muted" style="font-size:.82rem;margin-top:14px;text-align:center">Trip status (close/archive) lives in <b>MANAGE</b>.</p>':''}`)}
async function closeTripAction(){if(!isOwner())return;cur.status='closed';await push(cur);closeModal();renderTrip();toast('Trip closed')}
async function reopenTripAction(){if(!isOwner())return;cur.status='active';await push(cur);closeModal();renderTrip();toast('Trip reopened')}
async function archiveTripAction(){if(!isOwner())return;cur.status='archived';await push(cur);closeModal();renderHome();goHome();toast('Trip archived')}
function openShare(){shareTrip()}
function shareGroupInvite(){shareNative(tripUrl(),'Join our SplitLah trip '+cur.name)}
function openMemberInvite(){let rows=memberList().map(([id,m])=>`<div class="expense row">${av(id)}<div class="grow"><b>${esc(m.name)}</b><div class="muted">Send a direct claim link</div></div><button class="btn ghost" onclick="shareMemberInvite('${esc(id)}')">Invite</button></div>`).join('');modal(`<h2>Invite specific person</h2><p class="muted">Use this when you already added someone and want their link to suggest that member.</p><div class="card">${rows}</div><button class="btn ghost" style="width:100%" onclick="shareTrip()">Back</button>`)}
function shareMemberInvite(id){let name=memberName(id),url=tripUrl(id);shareNative(url,'Join SplitLah as '+name+' for '+cur.name)}
async function shareNative(url,msg){if(navigator.share){try{await navigator.share({title:'SplitLah trip '+cur.code,text:msg,url});closeModal();return}catch(e){if(e.name==='AbortError')return}}copyShare(url)}
async function copyShare(url){try{await navigator.clipboard.writeText(url);toast('Invite copied')}catch(e){toast('Copy failed')}}
async function installApp(){if(!installPrompt)return;let p=installPrompt;installPrompt=null;await p.prompt();await p.userChoice.catch(()=>{});renderHome()}
function dismissInstall(){state.installDismissed=true;save();renderHome()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;state.installDismissed=false;save();if(!cur)renderHome()});
window.addEventListener('appinstalled',()=>{installPrompt=null;state.installDismissed=true;save();toast('SplitLah installed')});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}));
function modal(html,center=false){$('modalBody').innerHTML=html;$('modal').classList.toggle('center',center);$('modal').classList.add('on')} function closeModal(){$('modal').classList.remove('on')}
window.addEventListener('popstate',e=>{let s=e.state||{view:'home'};if($('modal').classList.contains('on'))closeModal();if(s.view==='home')return goHome(false);if(s.code){if(!state.trips[s.code])return goHome(false);openTrip(s.code,s.tab||'dashboard',false)}});
function setTheme(t){document.body.classList.toggle('light',t==='light');localStorage.setItem('sl_theme',t);const b1=$('btnDark'),b2=$('btnLight');if(b1)b1.classList.toggle('on',t==='dark');if(b2)b2.classList.toggle('on',t==='light')}function setFontSize(v){v=Math.max(12,Math.min(18,+v));document.documentElement.style.setProperty('--fs',v+'px');localStorage.setItem('sl_fs',v);const lbl=$('fsLabel');if(lbl)lbl.textContent=v+'px'}async function uploadReceipt(dataUrl){const key=state.imagekitKey,url=state.imagekitUrl;if(!key||!url)return dataUrl;try{const blob=await(await fetch(dataUrl)).blob();const fd=new FormData();const name='receipt_'+Date.now()+'.jpg';fd.append('file',blob,name);fd.append('fileName',name);fd.append('publicKey',key);const r=await fetch('https://upload.imagekit.io/api/v1/files/upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw Error(j.message||'Upload failed');return j.url}catch(e){console.warn('ImageKit:',e.message);return dataUrl}}function renderSpendChart(){const exps=cur.expenses||[];if(!exps.length)return '<div class="muted" style="padding:20px 0;text-align:center">No expenses yet.</div>';const byDay={};exps.forEach(e=>{const d=(e.at||'').slice(0,10)||'?';byDay[d]=(byDay[d]||0)+(+e.amount||0)});const days=Object.keys(byDay).sort();if(!days.length)return '<div class="muted" style="padding:20px 0;text-align:center">No dated expenses.</div>';const MONTH_ABB=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const labels=days.map(d=>{const p=d.split('-');return p[2]+' '+MONTH_ABB[+p[1]-1];});const vals=days.map(d=>+byDay[d].toFixed(2));const id='sc'+Math.random().toString(36).slice(2,7);const light=document.body.classList.contains('light');const gc=light?'rgba(0,0,0,.07)':'rgba(255,255,255,.07)';const tc=light?'#6b6b65':'#b8b7af';setTimeout(()=>{const ctx=document.getElementById(id)?.getContext('2d');if(!ctx||!window.Chart)return;new Chart(ctx,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:'#1d9e75',borderRadius:5,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'S$'+c.parsed.y.toFixed(2)}}},scales:{y:{beginAtZero:true,grid:{color:gc},ticks:{color:tc,callback:v=>'S$'+v}},x:{grid:{display:false},ticks:{color:tc}}}}})},60);return `<div class="card"><canvas id="${id}" height="90"></canvas></div>`}
renderHome();if(restoreParam){let _rt=restoreParam;try{let _u=new URL(location.href);_u.searchParams.delete('restore');history.replaceState({},'',_u.pathname+(_u.search||'')+_u.hash)}catch(e){}setTimeout(()=>applyRestoreToken(_rt),150)}else if(adminParam==='feedback')setTimeout(openAdminFeedback,100);else if(adminParam==='summary')setTimeout(openAdminSummary,100);else if(adminParam==='dashboard')setTimeout(openAdminDashboard,100);else if(joinParam)setTimeout(()=>openInvite(joinParam.toUpperCase(),memberParam||''),100);else if(state.pendingInvite?.code)setTimeout(()=>openInvite(state.pendingInvite.code,state.pendingInvite.memberId||''),100);else if(!state.onboarded)setTimeout(()=>openSettings(true),100);
setInterval(()=>{if(cur&&!$('modal').classList.contains('on')&&!activeFormDirty())refreshTrip(true)},12000);
</script>
