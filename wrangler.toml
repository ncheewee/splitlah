#   openssl rand -base64 48 | npx wrangler secret put SESSION_SECRET
[vars]
GOOGLE_CLIENT_ID = "748458376843-ir6ncv7akbqqv28hm4k4hp8kgf94mntd.apps.googleusercontent.com"
